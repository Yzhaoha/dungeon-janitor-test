<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Tavern</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{text-shadow:0 2px 0 #2a1a2e,0 0 4px #2a1a2e,1px 1px 0 #2a1a2e,-1px -1px 0 #2a1a2e,1px -1px 0 #2a1a2e,-1px 1px 0 #2a1a2e}
#hud{position:fixed;inset:0;pointer-events:none}
#coinBox{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(40,24,48,.72);border:2px solid #f5c542;border-radius:22px;padding:4px 14px 4px 6px;font-size:24px;font-weight:900}
#coinBox .ico,.coinfly{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f8c630 45%,#c98a10);box-shadow:inset 0 -2px 0 #9a6608,0 1px 2px #0006;display:inline-block}
#coinBox.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
#wave{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(40,24,48,.72);border-radius:16px;padding:5px 14px;font-size:17px;font-weight:800;white-space:nowrap;text-align:center}
#wave .bar{height:5px;background:#ffffff22;border-radius:3px;margin-top:4px;overflow:hidden}
#wave .bar i{display:block;height:100%;background:#7ee06a;width:0}
#wave.soon .bar i{background:#ff7a59}
#wave.soon{animation:bump .5s infinite}
#wave.done .bar i{background:#ffd84a}
#comboWrap{position:absolute;left:50%;top:58px;transform:translateX(-50%);text-align:center}
#combo{display:inline-block;font-size:26px;font-weight:900;color:#ffb347}
#combo.hit{animation:bump .3s}
#comboWrap .bar{width:110px;height:5px;background:#ffffff22;border-radius:3px;margin:2px auto 0;overflow:hidden}
#comboWrap .bar i{display:block;height:100%;background:#ff9a3c}
#combo[style*="none"]+.bar{display:none}
#nmStars{font-size:44px;color:#ffd84a;letter-spacing:4px;line-height:1.1}
#nmSum{font-size:20px;font-weight:900;margin:2px 0 8px}
#nmPick{font-size:16px;font-weight:800;opacity:.9;margin-bottom:6px}
#nmCards{display:flex;gap:8px;justify-content:center}
.pcard{flex:1;min-width:0;max-width:150px;border:3px solid #ffd84a;border-radius:16px;background:linear-gradient(#fff7e0,#f3dca6);color:#3a2440;font:inherit;padding:10px 6px;cursor:pointer;box-shadow:0 5px 0 #0006;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
.pcard:hover{transform:translateY(-4px) scale(1.04)}
.pcard .em{font-size:38px;line-height:1.1}
.pcard b{font-size:15px;line-height:1.15}
.pcard .ds{font-size:15px;font-weight:900;color:#a0461a;white-space:nowrap}
.pcard .lv{font-size:11px;letter-spacing:2px;color:#8a6a3a;min-height:13px}
#rep{position:absolute;right:12px;top:10px;background:rgba(40,24,48,.72);border-radius:16px;padding:5px 12px;font-size:20px;letter-spacing:1px;color:#ffd84a;display:flex;align-items:center;gap:8px}
#rep small{color:#fff;font-size:13px;letter-spacing:0}
#topBtns{position:absolute;right:12px;top:52px;display:flex;gap:6px;pointer-events:auto}
.rb{pointer-events:auto;border:none;border-radius:12px;background:rgba(40,24,48,.8);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:6px 10px;cursor:pointer}
#boostBtn{position:absolute;right:12px;bottom:18px;pointer-events:auto;border:3px solid #fff;border-radius:18px;background:linear-gradient(#9b6bff,#6a3fd6);color:#fff;font:inherit;font-weight:900;font-size:16px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 #3d2380;text-align:center;line-height:1.1}
#boostBtn small{display:block;font-size:11px;opacity:.9}
#boostBtn.on{background:linear-gradient(#ffcf4a,#f29a1a);box-shadow:0 4px 0 #9a5a08}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);text-align:center;font-size:36px;font-weight:900;white-space:nowrap}
#banner small{display:block;font-size:17px;font-weight:700;margin-top:4px;white-space:normal;max-width:86vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tut{white-space:pre-line;position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:max-content;background:#fff;color:#3a2440;border-radius:18px;padding:10px 18px;font-size:19px;font-weight:800;max-width:88vw;text-align:center;box-shadow:0 5px 0 #0005;display:none;border:3px solid #ffd84a}
#tut.show{display:block;animation:pop .3s}
@keyframes pop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
.float{position:absolute;font-weight:900;font-size:20px;color:#ffe45c;pointer-events:none;transition:transform 1s ease-out,opacity 1s;white-space:nowrap}
.coinfly{position:absolute;width:20px;height:20px;transition:left .55s cubic-bezier(.5,-0.3,.7,1),top .55s cubic-bezier(.3,0,.2,1),transform .55s;pointer-events:none}
.modal{position:fixed;inset:0;background:#120a18aa;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:10}
.modal.show{display:flex}
.card{background:linear-gradient(#4a3256,#33213d);border:3px solid #f5c542;border-radius:22px;padding:18px 20px;min-width:280px;max-width:92vw;text-align:center;box-shadow:0 8px 0 #0006}
.card h2{margin:0 0 8px;font-size:26px}
.card .big{font-size:34px;font-weight:900;color:#ffe45c;margin:6px 0}
.btn{border:none;border-radius:16px;font:inherit;font-weight:900;font-size:19px;padding:11px 18px;margin:6px 4px 0;cursor:pointer;color:#fff;background:linear-gradient(#5fd068,#33a144);box-shadow:0 4px 0 #1f6b2b}
.btn.ad{background:linear-gradient(#9b6bff,#6a3fd6);box-shadow:0 4px 0 #3d2380}
.btn.gray{background:#6b5a75;box-shadow:0 4px 0 #3a2f40}
.btn:disabled{filter:grayscale(1);opacity:.6}
#bench .row{display:flex;align-items:center;gap:10px;background:#00000030;border-radius:14px;padding:7px 10px;margin:7px 0;text-align:left}
#bench .row .em{font-size:28px;width:36px;text-align:center}
#bench .row .tx{flex:1;font-size:15px}
#bench .row .tx b{font-size:17px}
#bench .row .lv{color:#ffd84a;letter-spacing:2px;font-size:13px}
#bench .row .btn{font-size:15px;padding:8px 10px;margin:0;min-width:92px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffffaa}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1220;z-index:20;font-size:22px;font-weight:800}
#loading .bar{width:220px;height:10px;background:#ffffff22;border-radius:6px;margin-top:12px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#f5c542;animation:ld 1s infinite alternate}
@keyframes ld{to{width:100%}}
#adfake{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:24px;z-index:30;pointer-events:auto}
#langSel{pointer-events:auto;background:rgba(40,24,48,.8);color:#fff;border:none;border-radius:12px;font:inherit;font-weight:800;font-size:14px;padding:6px 4px}
#pref{position:absolute;left:12px;top:54px;display:flex;gap:6px;pointer-events:auto}
@media (max-width:600px){
  #coinBox{font-size:20px;top:8px;left:8px}
  #wave{font-size:14px;padding:4px 10px}
  #comboWrap{top:124px}
  #combo{font-size:22px}
  #rep{font-size:16px;right:8px;top:8px}
  #rep small{display:none}
  #topBtns{top:46px;right:8px}
  #pref{top:48px;left:8px}
  #banner{font-size:28px}
  #tut{font-size:16px;bottom:20%}
  #boostBtn{font-size:14px;padding:6px 10px}
}
@media (max-height:480px){
  #tut{bottom:8%;font-size:15px}
  #banner{top:28%}
}
#taskBtn{position:relative}
#taskDot{display:none;position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:#ff4a4a;border:2px solid #fff}
#taskDot.on{display:block}
#dlDays{display:flex;gap:5px;justify-content:center;margin:6px 0;flex-wrap:wrap}
#dlDays div{width:46px;border-radius:10px;background:#00000040;padding:4px 0;font-size:11px;font-weight:800;opacity:.6}
#dlDays div b{display:block;font-size:20px}
#dlDays div.got{opacity:.45;text-decoration:line-through}
#dlDays div.now{opacity:1;background:linear-gradient(#ffcf4a,#f29a1a);color:#3a2440;transform:scale(1.08)}
#dlDays div.big b{font-size:26px}
#taskRows .row{display:flex;align-items:center;gap:10px;background:#00000030;border-radius:14px;padding:8px 10px;margin:7px 0;text-align:left}
#taskRows .tx{flex:1;font-size:15px}
#taskRows .pb{height:7px;background:#ffffff22;border-radius:4px;margin-top:4px;overflow:hidden}
#taskRows .pb i{display:block;height:100%;background:#7ee06a}
#taskRows .btn{font-size:15px;padding:8px 10px;margin:0;min-width:92px}
#xpBar{position:absolute;left:0;right:0;top:0;height:9px;background:#00000066}
#xpFill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff9a3c);transition:width .15s}
#lvlTx{position:absolute;right:12px;top:14px;background:rgba(40,24,48,.72);border-radius:14px;padding:4px 12px;font-size:19px;font-weight:900;color:#ffd84a}
#coinBox{top:14px} #pref{top:58px} #wave{top:14px}
#hpBar{position:absolute;width:54px;height:8px;background:#000a;border:1.5px solid #2a1a2e;border-radius:5px;overflow:hidden;display:none}
#hpFill{display:block;height:100%;background:#ff4d4d}
#wbar{position:absolute;left:10px;bottom:12px;display:none;flex-wrap:wrap;gap:4px;max-width:60vw}
#wbar span{background:rgba(40,24,48,.72);border-radius:10px;padding:3px 6px;font-size:19px}
#wbar i{font-style:normal;font-size:12px;font-weight:900;color:#ffd84a;margin-left:2px}
body.run #hpBar{display:block} body.run #wbar{display:flex} body.run #langSel{display:none}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 40px #ff2020}
#menu .card{max-height:96vh;overflow:auto}
#mnTitle{font-size:34px;font-weight:900;margin:0 0 2px}
#mnNightRow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:900;margin:6px 0}
#mnNightRow .rb{font-size:20px;padding:4px 12px} #mnNightRow .rb:disabled{opacity:.3}
#mnPlay{font-size:26px;padding:13px 44px;margin:4px 0 10px}
#mnGold{font-size:20px;font-weight:900;color:#ffe45c;margin-top:4px}
.srow{display:flex;align-items:center;gap:10px;background:#00000030;border-radius:14px;padding:6px 10px;margin:6px 0;text-align:left}
.srow .em{font-size:26px;width:34px;text-align:center} .srow .tx{flex:1;font-size:15px} .srow .tx b{font-size:16px}
.srow .lv{color:#ffd84a;letter-spacing:2px;font-size:12px} .srow .btn{font-size:15px;padding:8px 10px;margin:0;min-width:86px}
.pcard .ds.w{white-space:normal;font-size:13px;font-weight:700;color:#5a3a20;line-height:1.2}
.pcard .lv u{text-decoration:none;background:#ff5a4a;color:#fff;border-radius:6px;padding:1px 5px;letter-spacing:0;font-weight:900}
#lvTitle{color:#ffd84a}
#enGold{font-size:38px;font-weight:900;color:#ffe45c;margin:6px 0}
#enStats{font-size:16px;font-weight:800;opacity:.9}
@media (max-width:600px){ #wave{top:52px} #lvlTx{font-size:16px;top:12px;right:8px} #coinBox{top:12px} #mnTitle{font-size:28px} #wbar span{font-size:16px} }
@media (pointer:coarse),(max-width:900px),(max-height:500px){ body.pf-poki #wave{top:62px} }
@media (max-width:600px){ body.pf-poki #wave{top:92px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hurt"></div>
<div id="hud">
  <div id="xpBar"><i id="xpFill"></i></div>
  <div id="coinBox" class="out"><span class="ico"></span><span id="coins">0</span></div>
  <div id="pref"><button class="rb" id="sndBtn">🔊</button><select id="langSel"></select></div>
  <div id="wave" class="out"><span id="waveTx"></span><div class="bar"><i id="waveBar"></i></div></div>
  <div id="lvlTx" class="out"></div>
  <div id="hpBar"><i id="hpFill"></i></div>
  <div id="wbar"></div>
  <div id="banner" class="out"></div>
  <div id="tut"></div>
</div>
<div id="joy"><i></i></div>
<div class="modal" id="menu"><div class="card"><div id="mnTitle" class="out">Dungeon Tavern</div>
  <div id="mnNightRow"><button class="rb" id="mnPrev">◀</button><span id="mnNight" class="out"></span><button class="rb" id="mnNext">▶</button></div>
  <button class="btn" id="mnPlay" data-t="play"></button>
  <div id="mnGold" class="out"></div><div id="mnRows"></div></div></div>
<div class="modal" id="lvlM"><div class="card"><h2 class="out" id="lvTitle"></h2><div id="nmPick" data-t="pickOne"></div><div id="lvCards" style="display:flex;gap:8px;justify-content:center"></div><button class="btn ad" id="lvReroll"></button></div></div>
<div class="modal" id="endM"><div class="card"><h2 class="out" id="enTitle"></h2><div id="enStats"></div><div id="enGold" class="out"></div><button class="btn ad" id="enRevive"></button><button class="btn ad" id="enDouble"></button><button class="btn" id="enOk"></button></div></div>
<div id="adfake"></div>
<div id="loading"><div>Dungeon Tavern</div><div class="bar"><i></i></div></div>
<script id="gamesrc" type="text/plain">
// ===== SIM START =====
// v0.6 — Tavern Brawl: monsters storm the tavern, the innkeeper auto-attacks, you only move.
// Kill -> coins (xp) -> level up -> pick 1 of 3. Survive RUN seconds, then beat the boss.
// Pure logic (node can run it), events go to G.ev.
var DJ = (function(){
'use strict';
var W = 26, D = 20, RUN = 210, CAP = 150, MAXLV = 5;
var X0 = -W/2+0.7, X1 = W/2-0.7, Z0 = -D+2.4, Z1 = -0.7;
var ET = {
  slime:{hp:9,  spd:1.9, dmg:6,  r:0.45, xp:1},
  gob:  {hp:7,  spd:3.1, dmg:5,  r:0.38, xp:1},
  skel: {hp:24, spd:2.3, dmg:9,  r:0.45, xp:2},
  bat:  {hp:6,  spd:4.2, dmg:5,  r:0.35, xp:1},
  orc:  {hp:90, spd:1.7, dmg:15, r:0.7,  xp:6},
  elite:{hp:420,spd:2.0, dmg:18, r:1.0,  xp:30},
  boss: {hp:1600,spd:2.1,dmg:26, r:1.4,  xp:0}
};
var WEAP = ['pan','mug','barrel','fire','potion','gob'];
var PASS = ['boots','apron','magnet','haste','power','luck'];
var META = { hp:{max:5,cost:[30,70,150,300,600]}, power:{max:5,cost:[30,70,150,300,600]}, speed:{max:5,cost:[25,60,130,260,500]},
  magnet:{max:5,cost:[20,50,110,220,450]}, gold:{max:5,cost:[40,90,180,360,700]} };

function rnd(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lv(G,k){ return G.w[k]||0; }
function mv(G,k){ return G.meta[k]||0; }
function stats(G){
  return { maxhp: Math.round((100+20*lv(G,'apron'))*(1+0.1*mv(G,'hp'))), regen: 0.4*lv(G,'apron'),
    speed: 5.2*(1+0.07*lv(G,'boots'))*(1+0.04*mv(G,'speed')), magnet: (2.0+0.7*lv(G,'magnet'))*(1+0.15*mv(G,'magnet')),
    dmg: (1+0.14*lv(G,'power'))*(1+0.08*mv(G,'power')), cd: 1/(1+0.1*lv(G,'haste')), gold: (1+0.2*lv(G,'luck'))*(1+0.15*mv(G,'gold')) };
}
function newRun(meta, night, seed){
  var G = { t:0, rand:rnd(seed||12345), ev:[], phase:'play', night:night||1, meta:meta||{}, w:{pan:1}, cd:{}, orb:0,
    player:{x:0, z:-D/2, face:0, hp:100, ifr:0, moving:false},
    enemies:[], shots:[], pools:[], gems:[], meats:[], nid:1, xp:0, lvl:1, pend:0, offer:null, kills:0,
    spawnAcc:0, swarmT:30, eliteN:0, boss:null, bossDone:false, revived:false, hurtT:0 };
  G.player.hp = stats(G).maxhp;
  return G;
}
function xpNeed(l){ return 4 + l*3 + Math.floor(l*l*0.35); }
function clampP(p){ p.x=Math.max(X0,Math.min(X1,p.x)); p.z=Math.max(Z0,Math.min(Z1,p.z)); }

// ---------- spawning ----------
function hpMul(G){ return (1 + Math.min(G.t,RUN)/RUN*1.5) * (1+0.22*(G.night-1)); }
function dmgMul(G){ return 1+0.1*(G.night-1); }
function spawnPos(G, rad){
  var p=G.player, best=null, bd=0;
  for (var i=0;i<8;i++){ var a=G.rand()*Math.PI*2, r=(rad||11)+G.rand()*3, q={x:p.x+Math.cos(a)*r, z:p.z+Math.sin(a)*r}; clampP(q);
    var d=Math.hypot(q.x-p.x,q.z-p.z); if (d>=7.5) return q; if (d>bd){ bd=d; best=q; } }
  return best;
}
function spawn(G, type, pos, mul){
  var T=ET[type], q=pos||spawnPos(G);
  var e={id:G.nid++, type:type, x:q.x, z:q.z, hp:T.hp*hpMul(G)*(mul||1), r:T.r, spd:T.spd*(0.9+G.rand()*0.2), dmg:T.dmg*dmgMul(G), xp:T.xp,
    kx:0, kz:0, flash:0, face:0, ph:G.rand()*6, hitCd:0, gobCd:0, burnCd:0};
  e.maxhp=e.hp; G.enemies.push(e); return e;
}
function pickType(G){
  var t=G.t, r=G.rand(), o=[['slime',1]];
  if (t>18) o.push(['gob',0.9]); if (t>55) o.push(['skel',1.1]); if (t>95) o.push(['bat',0.8]); if (t>125) o.push(['orc',0.35+ (t-125)/200]);
  if (t>70) o[0][1]=0.4;
  var s=0; o.forEach(function(a){ s+=a[1]; }); r*=s;
  for (var i=0;i<o.length;i++){ r-=o[i][1]; if (r<=0) return o[i][0]; }
  return 'slime';
}
function stepSpawn(G, dt){
  var n=G.night;
  if (!G.boss && !G.bossDone && G.t>=RUN){
    G.boss=spawn(G,'boss',spawnPos(G,10)); G.boss.dashT=4; G.boss.mode='walk'; G.ev.push({t:'boss'});
  }
  var rate=(1.1 + Math.min(G.t,RUN)*0.033)*(1+0.06*(n-1)); if (G.boss) rate*=0.45;
  G.spawnAcc+=rate*dt;
  while (G.spawnAcc>=1){ G.spawnAcc-=1; if (G.enemies.length<CAP) spawn(G, pickType(G)); }
  if (!G.boss){ G.swarmT-=dt;
    if (G.swarmT<=0){ G.swarmT=30; var k=Math.min(26, 10+Math.floor(G.t/14)), ty=G.t>100?'bat':'gob', p=G.player, a0=G.rand()*6;
      for (var i=0;i<k && G.enemies.length<CAP;i++){ var a=a0+i/k*Math.PI*2, q={x:p.x+Math.cos(a)*9.5, z:p.z+Math.sin(a)*9.5}; clampP(q); if (Math.hypot(q.x-p.x,q.z-p.z)>5) spawn(G,ty,q); }
      G.ev.push({t:'swarm'}); }
    if (G.eliteN<2 && G.t>=(G.eliteN?150:75)){ G.eliteN++; spawn(G,'elite'); G.ev.push({t:'elite'}); } }
}

// ---------- damage ----------
function hit(G, e, d, dx, dz, kb){
  if (e.hp<=0) return;
  d*=stats(G).dmg; e.hp-=d; e.flash=0.12;
  if (kb && e.type!=='boss'){ var m=Math.hypot(dx,dz)||1, f=kb/(e.r*2); e.kx+=dx/m*f; e.kz+=dz/m*f; }
  G.ev.push({t:'hit', x:e.x, z:e.z, d:d, big:e.r>0.9});
  if (e.hp<=0) kill(G,e);
}
function kill(G, e){
  G.kills++;
  if (e.type==='boss'){ G.boss=null; G.bossDone=true; G.ev.push({t:'bossDead', x:e.x, z:e.z});
    G.enemies.forEach(function(o){ if(o!==e){ o.hp=0; G.ev.push({t:'kill', x:o.x, z:o.z, type:o.type}); } }); G.enemies=[]; G.phase='win'; G.ev.push({t:'win'}); return; }

function nearest(G, n, maxD, from){

}

// ---------- weapons ----------
function panRange(G){ return 2.2+0.22*lv(G,'pan'); }
function fireRange(G){ return 1.7+0.28*lv(G,'fire'); }
function poolRange(G){ return 1.5+0.2*lv(G,'potion'); }
function gobCount(G){ var l=lv(G,'gob'); return l? 1+Math.floor(l/2) : 0; }
function gobPos(G, i){ var n=gobCount(G), a=G.orb+i/n*Math.PI*2, p=G.player; return {x:p.x+Math.sin(a)*2.5, z:p.z+Math.cos(a)*2.5, a:a}; }
function stepWeapons(G, dt){
  var p=G.player, S=stats(G), cd=G.cd, l;

      G.enemies.slice().forEach(function(e){ var dx=e.x-p.x, dz=e.z-p.z, d=Math.hypot(dx,dz)-e.r; if (d>R) return;
        var da=Math.atan2(dx,dz)-ang; da=Math.atan2(Math.sin(da),Math.cos(da)); if (Math.abs(da)>arc) return;

  }

    var ts=nearest(G,1+Math.floor(l/2),10);
    if (ts.length){ cd.mug=1.15*S.cd; ts.forEach(function(e){ var dx=e.x-p.x, dz=e.z-p.z, m=Math.hypot(dx,dz)||1;
      G.shots.push({id:G.nid++, k:'mug', x:p.x, z:p.z, vx:dx/m*13, vz:dz/m*13, life:1.1, r:0.45, dmg:9+4*l, pierce:1+Math.floor(l/3), kb:3, seen:{}}); });

    var bt=nearest(G,1,9)[0];
    if (bt){ cd.barrel=(4.2-0.3*l)*S.cd; var n=l>=5?3:(l>=3?2:1), a0=Math.atan2(bt.x-p.x, bt.z-p.z);
      for (var i=0;i<n;i++){ var a=a0+i/n*Math.PI*2; G.shots.push({id:G.nid++, k:'barrel', x:p.x, z:p.z, vx:Math.sin(a)*8.5, vz:Math.cos(a)*8.5, life:2.4, r:0.95, dmg:26+12*l, pierce:999, kb:5, seen:{}}); }
      G.ev.push({t:'roll'}); }
  }
  // grill fire: burns everything close to you
  if ((l=lv(G,'fire')) && cd.fire<=0){ cd.fire=0.5; var FR=fireRange(G);
    G.enemies.slice().forEach(function(e){ var dx=e.x-p.x, dz=e.z-p.z; if (Math.hypot(dx,dz)-e.r<=FR) hit(G,e,3.5+2.5*l,dx,dz,0); }); }
  // bad potion: lobbed, leaves a puddle
  if ((l=lv(G,'potion')) && cd.potion<=0){
    var c=nearest(G,12,8.5);
    if (c.length){ cd.potion=3.1*S.cd; for (var j=0;j<(l>=3?2:1);j++){ var e2=c[Math.floor(G.rand()*c.length)];
      G.pools.push({id:G.nid++, x:e2.x, z:e2.z, r:poolRange(G), delay:0.45, life:3.2, tick:0, dmg:5+3*l}); G.ev.push({t:'lob', x:e2.x, z:e2.z}); } }

}
function stepShots(G, dt){
  for (var i=G.shots.length-1;i>=0;i--){ var s=G.shots[i]; s.x+=s.vx*dt; s.z+=s.vz*dt; s.life-=dt;
    var dead = s.life<=0 || s.x<X0-1 || s.x>X1+1 || s.z<Z0-1.5 || s.z>Z1+1;
    if (!dead){ var es=G.enemies.slice(); for (var j=0;j<es.length;j++){ var e=es[j]; if (s.seen[e.id]) continue;
      if (Math.hypot(e.x-s.x,e.z-s.z)<=e.r+s.r){ s.seen[e.id]=1; hit(G,e,s.dmg,s.vx,s.vz,s.kb); if (--s.pierce<=0){ dead=true; break; } } } }
    if (dead){ G.ev.push({t:'shotEnd', k:s.k, x:s.x, z:s.z}); G.shots.splice(i,1); } }
  for (var k=G.pools.length-1;k>=0;k--){ var o=G.pools[k];

    if (o.life<=0) G.pools.splice(k,1); }
}

// ---------- enemies ----------
function stepEnemies(G, dt){
  var p=G.player, es=G.enemies, n=es.length, i, j;
  for (i=0;i<n;i++){ var e=es[i];
    e.flash=Math.max(0,e.flash-dt); e.hitCd-=dt; e.gobCd-=dt; e.ph+=dt*e.spd*3;
    var dx=p.x-e.x, dz=p.z-e.z, d=Math.hypot(dx,dz)||0.001, sp=e.spd;
    if (e.type==='boss'){
      e.dashT-=dt;
      if (e.mode==='walk' && e.dashT<=0){ e.mode='wind'; e.dashT=0.85; e.dx=dx/d; e.dz=dz/d; G.ev.push({t:'bossWind'}); }
      else if (e.mode==='wind'){ sp=0; if (e.dashT<=0){ e.mode='dash'; e.dashT=0.7; G.ev.push({t:'bossDash'}); } }
      else if (e.mode==='dash'){ if (e.dashT<=0){ e.mode='walk'; e.dashT=4.2; } }
      if (e.mode==='dash'){ e.x+=e.dx*12*dt; e.z+=e.dz*12*dt; e.face=Math.atan2(e.dx,e.dz); sp=0; }
    }
    if (sp>0){ var wx=0, wz=0; if (e.type==='bat'){ var w=Math.sin(e.ph*0.7)*0.8; wx=-dz/d*w; wz=dx/d*w; }
      e.x+=(dx/d+wx)*sp*dt; e.z+=(dz/d+wz)*sp*dt; e.face=Math.atan2(dx,dz); }
    e.x+=e.kx*dt; e.z+=e.kz*dt; var dec=Math.max(0,1-dt*7); e.kx*=dec; e.kz*=dec;
    if (d<e.r+0.42 && e.hitCd<=0 && p.ifr<=0){ e.hitCd=0.6; hurt(G, e.dmg); }
  }
  // separation (cheap n^2, n <= CAP)
  for (i=0;i<n;i++){ var a=es[i]; for (j=i+1;j<n;j++){ var b=es[j], ox=b.x-a.x, oz=b.z-a.z, rr=(a.r+b.r)*0.85;
    if (Math.abs(ox)>rr||Math.abs(oz)>rr) continue; var od=Math.hypot(ox,oz); if (od>=rr) continue; if (od<0.001){ ox=0.01; od=0.01; }
    var push=(rr-od)*0.5, wa=b.r/(a.r+b.r); a.x-=ox/od*push*wa*2; a.z-=oz/od*push*wa*2; b.x+=ox/od*push*(1-wa)*2; b.z+=oz/od*push*(1-wa)*2; } }
  for (i=0;i<n;i++){ var c=es[i]; c.x=Math.max(X0-0.3,Math.min(X1+0.3,c.x)); c.z=Math.max(Z0-0.3,Math.min(Z1+0.3,c.z)); }
}
function hurt(G, d){
  var p=G.player; p.hp-=d; p.ifr=0.3; G.hurtT=0.25; G.ev.push({t:'hurt', d:d});
  if (p.hp<=0){ p.hp=0; G.phase='dead'; G.ev.push({t:'dead'}); }
}

// ---------- pickups / levels ----------
function stepPickups(G, dt){
  var p=G.player, S=stats(G), mg=S.magnet;
  for (var i=G.gems.length-1;i>=0;i--){ var g=G.gems[i], dx=p.x-g.x, dz=p.z-g.z, d=Math.hypot(dx,dz);
    if (d<mg) g.pull=true;
    if (g.pull){ var sp=Math.max(9, 14-d)*dt; if (d<=sp+0.3){ G.gems.splice(i,1); G.xp+=g.v; G.ev.push({t:'gem', v:g.v}); continue; } g.x+=dx/d*sp; g.z+=dz/d*sp; } }
  for (var k=G.meats.length-1;k>=0;k--){ var m=G.meats[k]; if (Math.hypot(p.x-m.x,p.z-m.z)<1.0){ G.meats.splice(k,1); var h=Math.min(S.maxhp-p.hp, S.maxhp*0.3); p.hp+=h; G.ev.push({t:'heal', v:h}); } }
  while (G.xp>=xpNeed(G.lvl)){ G.xp-=xpNeed(G.lvl); G.lvl++; G.pend++; }

}
function offer(G){
  var pool=WEAP.concat(PASS).filter(function(k){ return lv(G,k)<MAXLV; });
  if (!pool.length) return ['gold'];
  var out=[];
  // early on always show at least one brand new weapon
  var fresh=WEAP.filter(function(k){ return !lv(G,k); });
  if (G.lvl<=6 && fresh.length){ var f=fresh[Math.floor(G.rand()*fresh.length)]; out.push(f); pool.splice(pool.indexOf(f),1); }
  while (out.length<3 && pool.length) out.push(pool.splice(Math.floor(G.rand()*pool.length),1)[0]);
  for (var i=out.length-1;i>0;i--){ var j=Math.floor(G.rand()*(i+1)), t=out[i]; out[i]=out[j]; out[j]=t; }
  return out;
}

function goldEarned(G){

// ---------- main ----------
function step(G, dt, ix, iz){

  G.t+=dt; G.hurtT=Math.max(0,G.hurtT-dt);

  p.moving=m>0.15; if (p.moving){ p.x+=ix*S.speed*dt; p.z+=iz*S.speed*dt; p.face=Math.atan2(ix,iz); clampP(p); }
  p.ifr=Math.max(0,p.ifr-dt); if (S.regen>0) p.hp=Math.min(S.maxhp, p.hp+S.regen*dt);

function mergeGeo(parts){ // [geometry, colour, x,y,z, sx,sy,sz]
  var pos=[], nor=[], col=[], c=new T.Color(), m=new T.Matrix4(), q=new T.Quaternion();
  parts.forEach(function(p){ var g=p[0].index? p[0].toNonIndexed() : p[0].clone();
    var sx=p[5]||1; m.compose(new T.Vector3(p[2]||0,p[3]||0,p[4]||0), q, new T.Vector3(sx, p[6]||sx, p[7]||sx)); g.applyMatrix4(m);
    var a=g.attributes.position.array, n=g.attributes.normal.array; c.set(p[1]);
    for (var i=0;i<a.length;i+=3){ pos.push(a[i],a[i+1],a[i+2]); nor.push(n[i],n[i+1],n[i+2]); col.push(c.r,c.g,c.b); } });
  var out=new T.BufferGeometry();
  out.setAttribute('position', new T.Float32BufferAttribute(pos,3)); out.setAttribute('normal', new T.Float32BufferAttribute(nor,3)); out.setAttribute('color', new T.Float32BufferAttribute(col,3));
  return out;
}

function makeLabel(text, w, h, color, bg, font){
  if (COVER) text=''; // store covers: no in-world text
  var tex=canvasTex(w,h,function(x){ drawLabel(x,w,h,text,color,bg,font); });
  var m=new T.Mesh(new T.PlaneGeometry(1,1), new T.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  m.userData.redraw=function(t){ var cv=tex.image, x=cv.getContext('2d'); x.clearRect(0,0,w,h); drawLabel(x,w,h,t,color,bg,font); tex.needsUpdate=true; };
  return m;
}
function drawLabel(x,w,h,text,color,bg,font){
  if (bg){ x.fillStyle=bg; x.beginPath(); if(x.roundRect) x.roundRect(2,2,w-4,h-4,h/2.5); else x.rect(2,2,w-4,h-4); x.fill(); }
  x.font=(font||'900 '+Math.floor(h*0.55)+'px "Trebuchet MS",system-ui,sans-serif'); x.textAlign='center'; x.textBaseline='middle';
  x.lineWidth=Math.max(3,h*0.08); x.strokeStyle='#2a1a2e'; if(!bg) x.strokeText(text,w/2,h/2+2);
  x.fillStyle=color; x.fillText(text,w/2,h/2+2);
}

    x.fillStyle='#3a2440'; x.font='60px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(emoji,64,62); });

}

// ---------------- events ----------------
var hitSndT=0, shake=0, hurtFx=0, numT=0;
function handleEvents(){
  var ev=G.ev; G.ev=[]; var now=performance.now();
  for (var i=0;i<ev.length;i++){ var e=ev[i];
    switch(e.t){
      case 'hit': if (bits.length<200) burst(e.x,e.z,0xffffff,1,1.5); if (now-hitSndT>55){ hitSndT=now; Snd.hit(); }
        if (now-numT>70 || e.big){ numT=now; floatText(''+Math.round(e.d), e.x, 1.4, e.z, e.big?'#ffb347':'#ffffff'); } break;
      case 'kill': burst(e.x,e.z,ECOL[e.type]||0xffffff,5,3); break;
      case 'swing': swingFx(e); panKick=0.2; Snd.swing(); break;
      case 'throw': Snd.take(); break;
      case 'roll': Snd.thud(); break;
      case 'splash': Snd.squish(); burst(e.x,e.z,0x6cff5a,6,3); break;
      case 'gem': Snd.coin(); break;
      case 'heal': floatText('+'+Math.round(e.v)+' ❤️', G.player.x, 2.4, G.player.z, '#7ee06a', true); Snd.buy(); break;
      case 'hurt': shake=0.2; hurtFx=1; Snd.bad(); break;
      case 'levelup': rerolled=false; showLevel(); Snd.buy(); PF.happy(); break;
      case 'swarm': banner(tl('swarm'),'',1600); Snd.horn(); break;
      case 'elite': banner(tl('elite'),'',1800); Snd.boss(); break;
      case 'boss': banner(tl('bossIn'),'',3000); Snd.boss(); shake=0.4; break;
      case 'bossDash': Snd.thud(); shake=0.25; break;
      case 'bossDead': burst(e.x,e.z,0xffd84a,40,6); shake=0.6; break;
      case 'revive': burst(G.player.x,G.player.z,0xfff2b0,40,5); shake=0.4; Snd.boss(); break;
      case 'dead': setTimeout(function(){ showEnd(false); }, 700); Snd.thud(); shake=0.5; break;
      case 'win': setTimeout(function(){ showEnd(true); }, 1400); break;
    }
  }
}

// ---------------- frame ----------------
var last=performance.now(), acc=0, lightT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.1,(now-last)/1000); last=now;
  var live = G.phase==='play' && !PF.adBusy && !document.hidden;
  PF.setPlaying(live);
  var inp=readInput();
  if (live){ acc+=dt; var steps=0; while(acc>=1/60 && steps<5){ acc-=1/60; steps++; DJ.step(G, 1/60, inp[0], inp[1]); } if (steps>=5) acc=0; }
  handleEvents();
  if (G.phase!=='levelup' && $('lvlM').classList.contains('show')) $('lvlM').classList.remove('show');
  render(dt, live);
  perfTick(dt);
  updHud();
}
function setInst(im, i, x,y,z, yaw, sx,sy,sz, col){
  dummy.position.set(x,y,z); dummy.rotation.set(0,yaw,0); dummy.scale.set(sx,sy,sz); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); if (col) im.setColorAt(i, col);
}
function render(dt, live){
  var p=G.player, t=performance.now()/1000, i;
  player.position.set(p.x,0,p.z);
  player.rotation.y += angDiff(player.rotation.y, p.face)*Math.min(1,dt*14);
  animChar(player, live&&p.moving, dt, false);
  player.visible = !(p.ifr>0 && G.phase==='play' && Math.floor(t*18)%2) && G.phase!=='dead';
  panKick=Math.max(0,panKick-dt); panMesh.rotation.x = panKick>0 ? Math.sin(panKick/0.2*Math.PI)*1.6 : 0;
  // monsters
  var cnt={slime:0,gob:0,skel:0,bat:0,orc:0,elite:0}, es=G.enemies;
  for (i=0;i<es.length;i++){ var e=es[i]; if (e.type==='boss') continue; var im=EM[e.type], n=cnt[e.type]; if (n>=EMAX[e.type]) continue; cnt[e.type]=n+1;
    var hop=Math.abs(Math.sin(e.ph)), s=e.type==='elite'?1.5:1, sq=e.type==='slime'? 1+hop*0.25 : 1;
    setInst(im, n, e.x, e.type==='bat'? Math.sin(e.ph*0.8)*0.2 : hop*0.14, e.z, e.face, s/Math.sqrt(sq), s*sq, s/Math.sqrt(sq), e.flash>0?cFlash:(e.type==='elite'?cElite:cWhite)); }
  Object.keys(EM).forEach(function(k){ var im=EM[k]; im.count=cnt[k]; im.instanceMatrix.needsUpdate=true; if (im.instanceColor) im.instanceColor.needsUpdate=true; });
  // boss
  var b=G.boss; bossV.visible=!!b; teleV.visible=false;
  if (b){ bossV.position.set(b.x,0,b.z); bossV.rotation.y += angDiff(bossV.rotation.y, b.mode==='wind'?Math.atan2(b.dx,b.dz):b.face)*Math.min(1,dt*10); animChar(bossV, b.mode!=='wind', dt, false);
    bossV.scale.setScalar(2.7*(b.flash>0?1.06:1)*(b.mode==='wind'?1+Math.sin(t*40)*0.03:1));
    if (b.mode==='wind'){ teleV.visible=true; teleV.position.set(b.x,0.06,b.z); teleV.rotation.y=Math.atan2(b.dx,b.dz); teleV.material.opacity=0.25+Math.abs(Math.sin(t*14))*0.3; } }
  // coins
  var gs=G.gems, gn=Math.min(gs.length, 280);
  for (i=0;i<gn;i++){ var g=gs[i], gsz=g.v>=4?1.6:(g.v>=2?1.25:1); setInst(gemIM, i, g.x, 0.32+Math.sin(t*4+g.id)*0.06, g.z, t*4+g.id, gsz,gsz,gsz); }
  gemIM.count=gn; gemIM.instanceMatrix.needsUpdate=true;
  // shots
  var mn=0, bn=0;
  G.shots.forEach(function(s){
    if (s.k==='mug' && mn<40){ dummy.position.set(s.x,0.9,s.z); dummy.rotation.set(t*14+s.id, 0, t*9); dummy.scale.set(1,1,1); dummy.updateMatrix(); mugIM.setMatrixAt(mn++, dummy.matrix); }
    else if (s.k==='barrel' && bn<barrelV.length){ var bv=barrelV[bn++]; bv.visible=true; bv.position.set(s.x,0,s.z); bv.rotation.y=Math.atan2(s.vx,s.vz); bv.children[0].rotation.x=t*10; }
  });
  mugIM.count=mn; mugIM.instanceMatrix.needsUpdate=true; for (i=bn;i<barrelV.length;i++) barrelV[i].visible=false;
  for (i=0;i<poolV.length;i++){ var o=G.pools[i], pv=poolV[i]; pv.visible=!!o; if (o){ pv.position.set(o.x,0.05,o.z); var ps=o.delay>0? o.r*(1-o.delay/0.45)*0.6+0.2 : o.r*(1+Math.sin(t*6+i)*0.04); pv.scale.set(ps,ps,ps); pv.material.opacity=o.delay>0?0.2:Math.min(0.45,o.life*0.6); } }
  for (i=0;i<meatV.length;i++){ var mt=G.meats[i], mv=meatV[i]; mv.visible=!!mt; if (mt){ mv.position.set(mt.x, Math.sin(t*3+i)*0.1, mt.z); mv.rotation.y=t*1.5; } }
  // auras / helpers
  var fl=DJ.lv(G,'fire'); fireV.visible=fl>0 && G.phase!=='menu'; if (fl){ var fr=DJ.fireRange(G)*(1+Math.sin(t*9)*0.03); fireV.position.set(p.x,0,p.z); fireV.scale.set(fr,1,fr); fireV.rotation.y=t*1.2; }
  var gc=G.phase==='menu'?0:DJ.gobCount(G); for (i=0;i<gobV.length;i++){ var gv=gobV[i]; gv.visible=i<gc; if (i<gc){ var q=DJ.gobPos(G,i); gv.position.set(q.x,0,q.z); gv.rotation.y=q.a+Math.PI/2; animChar(gv,true,dt,false); } }
  swingV.forEach(function(s){ if (s.t>0){ s.t-=dt; s.m.opacity=Math.max(0,s.t/0.2)*0.7; if (s.t<=0) s.g.visible=false; } });
  // bits
  var bi=0;
  for (i=bits.length-1;i>=0;i--){ var bt=bits[i]; bt.t-=dt; if (bt.t<=0){ bits.splice(i,1); continue; } bt.x+=bt.vx*dt; bt.y+=bt.vy*dt; bt.z+=bt.vz*dt; bt.vy-=12*dt; if (bt.y<0.08){ bt.y=0.08; bt.vy*=-0.4; } }
  for (i=0;i<bits.length && bi<260;i++){ var b2=bits[i], sc=Math.min(1,b2.t*3); setInst(bitIM, bi++, b2.x,b2.y,b2.z, b2.t*8, sc,sc,sc, cTmp.set(b2.c)); }
  bitIM.count=bi; bitIM.instanceMatrix.needsUpdate=true; if (bitIM.instanceColor) bitIM.instanceColor.needsUpdate=true;
  // lights
  lightT-=dt;
  if (lightT<=0){ lightT=0.5; var sorted=torches.slice().sort(function(a,c){ return Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(c.x-p.x,c.z-p.z); });
    torchLights.forEach(function(L,k){ var tt=sorted[k]; if(tt){ L.position.set(tt.x,2.3,tt.z); L.userData.t=tt; } else L.userData.t=null; }); }
  torchLights.forEach(function(L){ var tt=L.userData.t; L.intensity = tt? 6+Math.sin(t*9+tt.ph)*1.2 : 0; });
  torches.forEach(function(tt){ tt.fl.scale.y=1+Math.sin(t*10+tt.ph)*0.15; });
  // camera
  var portrait = innerHeight>innerWidth*1.1, cy = portrait? 25:18.5, cz = portrait? 14:12.5;
  camGoal.set(p.x*0.72, cy, -D/2+(p.z+D/2)*0.78+cz);   // lean toward the middle so the edges show less empty space camera.position.lerp(camGoal, Math.min(1, dt*6));
  var sx=0, sz=0; if (shake>0){ shake-=dt; sx=(Math.random()-0.5)*shake*1.2; sz=(Math.random()-0.5)*shake*1.2; }
  camera.position.x+=sx; camera.position.z+=sz;
  camera.lookAt(camera.position.x, 0, camera.position.z-cz+0.4);
  sun.position.set(p.x+6, 18, p.z+8); sun.target.position.set(p.x,0,p.z);
  if (hurtFx>0){ hurtFx=Math.max(0,hurtFx-dt*3); } $('hurt').style.opacity=hurtFx*0.55;
  renderer.render(scene,camera);
}

var camGoal=new T.Vector3();
function angDiff(a,b){ var d=(b-a)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }
var perfT=0, perfN=0, perfWarm=3, fpsEl=null;
function perfTick(dt){
  if (perfWarm>0){ perfWarm-=dt; return; }
  perfT+=dt; perfN++;
  if (perfT>=2){
    var fps=perfN/perfT; perfT=0; perfN=0;
    if (SHOWFPS){ if(!fpsEl){ fpsEl=document.createElement('div'); fpsEl.style.cssText='position:fixed;left:4px;bottom:4px;font:11px monospace;color:#fff8;z-index:50;pointer-events:none'; document.body.appendChild(fpsEl);} fpsEl.textContent=fps.toFixed(0)+'fps q'+QUAL; }
    if (fps<40 && QUAL>-1 && !document.hidden && !QS.has('q')){ setQual(QUAL-1); perfWarm=1.5; }
  }
}
function setQual(q){
  QUAL=q; try{ localStorage.setItem('dj_q',''+q); }catch(e){}
  renderer.setPixelRatio(dprFor(q)); resize();
  if (q<2){ torchLights.forEach(function(L){ scene.remove(L); }); torchLights=[]; hemi.intensity=1.45; }
  if (q<1){ renderer.shadowMap.enabled=false; sun.castShadow=false; scene.traverse(function(o){ if(o.material) o.material.needsUpdate=true; }); }
}
var SHOWFPS=PF.kind==='none'||QS.has('fps');
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect=innerWidth/innerHeight; camera.fov = camera.aspect<0.8? 52 : 40; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);


// ---------------- boot ----------------
function boot(){
  LANG=detectLang(PF.locale); applyLang(); loadSave();
  buildArena(); buildInstances(); buildActors();
  G=DJ.newRun(SAVE.meta, SAVE.sel, 1); G.phase='menu';
  resize(); camera.position.set(0, 18.5, -D/2+12.5);
  $('loading').style.display='none';
  PF.loaded(); showMenu();
  if (DEBUG){ Object.defineProperty(window,'__G',{get:function(){ return G; }}); window.__DJ=DJ; window.__SAVE=SAVE; window.__PF=PF; window.__ri=renderer.info;
    window.__step=function(sec,ix,iz){ for(var i=0;i<sec*60;i++) DJ.step(G,1/60,ix||0,iz||0); }; }
  requestAnimationFrame(function(n){ last=n; frame(n); });
}
PF.init().then(boot, boot);
})();
// ===== GAME END =====
