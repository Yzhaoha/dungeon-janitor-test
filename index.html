<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>药水骑士 · Potion Knight</title>
<style>
  html,body { margin:0; height:100%; background:#1a1220; }
  body { display:grid; place-items:center; box-sizing:border-box;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { position:relative; width:100%; height:100%; overflow:hidden; }
  iframe { position:absolute; left:50%; top:50%; width:844px; height:475px; border:0;
    transform:translate(-50%,-50%) scale(var(--scale)); }
</style>
</head>
<body>
<main id="stage"></main>
<script>
const gameUrl = 'ui-test/moon.html' + location.search + location.hash;
{
  const stage = document.getElementById('stage');
  const game = document.createElement('iframe');
  game.title = '药水骑士 · Potion Knight';
  game.allow = 'autoplay; fullscreen';
  function fitGame() {
    stage.style.setProperty('--scale', Math.min(stage.clientWidth / 844, stage.clientHeight / 475));
  }
  fitGame();
  new ResizeObserver(fitGame).observe(stage);
  game.src = gameUrl;
  stage.appendChild(game);
}
</script>
</body>
</html>
