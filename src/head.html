#inLogo.cjk>span{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;font-weight:900;-webkit-text-stroke:0}
#inLogo.pop{transform:scale(var(--u,1))}
#inLogo small{display:inline-block;font-size:20px;color:#fff0d0;letter-spacing:3px;margin-top:10px;padding:4px 22px;background:linear-gradient(#b8302a,#6e1218);border:2px solid #e2b155;border-radius:4px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);padding:4px 30px;-webkit-text-stroke:0;filter:none}
#inStory{font-size:16px;font-weight:800;color:#e8dcf4;opacity:0;transition:opacity .6s;margin:22px auto 0;max-width:86vw;transform:scale(var(--u,1))}
#inTap{position:absolute;left:0;right:0;bottom:10%;text-align:center;font-size:16px;font-weight:800;color:#fff;opacity:0;transition:opacity .5s;transform:scale(var(--u,1))}
#inTap.on{opacity:.9;animation:rdy 1.2s infinite}
#dailyM{align-items:center;padding-bottom:0}
#dailyM .card{padding:12px 14px 16px}
#days{display:grid;grid-template-columns:repeat(4,64px);gap:6px;justify-content:center;margin:8px 0}
.dd{height:76px;border-radius:12px;background:#2a1f33;border:2px solid #4a3a56;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#c8b8d4;position:relative}
.dd b{font-size:15px;color:#ffe98a;margin-top:2px}
.dd .coin{font-size:20px;margin:3px 0 1px}
.dd.got{opacity:.55} .dd.got:after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#8df07a;text-shadow:0 2px 0 #0008}
.dd.now{border-color:#ffe45c;background:#3a2c44;box-shadow:0 0 12px #ffe45c88;animation:rdy 1.1s infinite;color:#fff}
.dd.big{grid-column:span 1;background:linear-gradient(#4a2a6a,#2a1a3a);border-color:#b97aff}
.dd canvas{width:32px;height:32px}
#dailyHint{font-size:13px;font-weight:800;color:#c8b8d4;margin-bottom:4px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1220;z-index:20;font-size:22px;font-weight:800}
#loading .bar{width:220px;height:10px;background:#ffffff22;border-radius:6px;margin-top:12px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#f5c542;animation:ld 1s infinite alternate;transition:width .25s}
#ldPct{font-size:14px;color:#c9b8d8;margin-top:8px;font-weight:700}
@keyframes ld{to{width:100%}}
#adfake{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:24px;z-index:30;pointer-events:auto}
@media (max-width:600px){ #lvl{font-size:18px;top:54px;left:10px;transform:none;padding:4px 12px} #banner{font-size:19px} #tut{font-size:14px} #btns button{width:56px;height:56px;font-size:24px} #btns button>.ic{font-size:32px} }
/* Poki pill sits at top centre: keep the level chip clear of it */
body.pf-poki #lvl{top:70px}
@media (max-width:600px){ body.pf-poki #lvl{top:100px} }
</style>
</head>
