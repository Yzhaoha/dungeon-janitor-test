<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Tavern</title>
<!--PLATFORM_HEAD-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{text-shadow:0 2px 0 #2a1a2e,0 0 4px #2a1a2e,1px 1px 0 #2a1a2e,-1px -1px 0 #2a1a2e,1px -1px 0 #2a1a2e,-1px 1px 0 #2a1a2e}
#hud{position:fixed;inset:0;pointer-events:none}
#pref{position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:auto;transform:scale(var(--u,1));transform-origin:0 0}
.rb{pointer-events:auto;border:none;border-radius:12px;background:rgba(40,24,48,.8);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:7px 10px;cursor:pointer}
#langSel{pointer-events:auto;background:rgba(40,24,48,.8);color:#fff;border:none;border-radius:12px;font:inherit;font-weight:800;font-size:14px;padding:6px 4px;max-width:104px}
#lvl{position:absolute;left:50%;top:9px;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 0;background:rgba(40,24,48,.78);border:2px solid #f5c542;border-radius:20px;padding:4px 16px;font-size:20px;font-weight:900;white-space:nowrap}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);text-align:center;font-size:24px;font-weight:900;width:max-content;max-width:92vw;background:rgba(30,18,38,.9);border:2px solid #f5c542;border-radius:16px;padding:8px 18px;box-shadow:0 5px 0 #0005}
#banner small{display:block;font-size:17px;font-weight:700;margin-top:4px;white-space:normal;max-width:86vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tut{position:absolute;left:50%;top:300px;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 0;width:max-content;background:#fff;color:#3a2440;border-radius:14px;padding:6px 14px;font-size:16px;line-height:1.3;font-weight:800;max-width:90vw;text-align:center;box-shadow:0 5px 0 #0005;display:none;border:3px solid #ffd84a}
#tut.show{display:block}
#btns{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 100%;display:flex;gap:12px;pointer-events:auto}
#btns button{position:relative;width:62px;height:62px;border-radius:20px;border:3px solid #fff;background:linear-gradient(#7a5a8c,#4a3256);box-shadow:0 5px 0 #2a1a2e;color:#fff;font:inherit;font-size:27px;cursor:pointer;padding:0;transition:transform .08s}
#btns button:active{transform:translateY(4px);box-shadow:0 1px 0 #2a1a2e}
#btns button i{position:absolute;right:-7px;top:-9px;min-width:24px;height:24px;border-radius:12px;background:#ff5a4a;border:2px solid #fff;font-style:normal;font-size:13px;font-weight:900;line-height:20px;padding:0 4px}
#btns button i.ad{background:#8b5cf6;font-size:12px}
#btns.nudge #bUndo,#btns.nudge #bAdd{animation:nud .5s 3}
@keyframes nud{50%{transform:translateY(-8px) scale(1.08)}}
.modal{position:fixed;inset:0;background:#120a1855;display:none;align-items:flex-end;justify-content:center;pointer-events:auto;z-index:10;padding-bottom:9vh}
.modal.show{display:flex}
.card{background:linear-gradient(#4a3256,#33213d);border:3px solid #f5c542;border-radius:24px;padding:14px 30px 18px;min-width:250px;max-width:92vw;text-align:center;box-shadow:0 8px 0 #0006;transform:scale(var(--u,1));animation:cardIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{0%{transform:translateY(60px) scale(.8);opacity:0}}
.card h2{margin:0 0 2px;font-size:30px}
#wnIc{font-size:46px;line-height:1.1}
#wnSub{font-size:17px;font-weight:800;opacity:.85;margin-bottom:8px}
.btn{border:none;border-radius:18px;font:inherit;font-weight:900;font-size:24px;padding:12px 40px;margin:6px 4px 0;cursor:pointer;color:#fff;background:linear-gradient(#5fd068,#33a144);box-shadow:0 5px 0 #1f6b2b}
.btn.ad{background:linear-gradient(#9b6bff,#6a3fd6);box-shadow:0 5px 0 #3d2380;font-size:20px;padding:11px 22px}
.btn:disabled{filter:grayscale(1);opacity:.6}
#loseM .btn{display:block;margin:8px auto 0;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1f6b2b}
#coinBox{position:fixed;right:10px;top:10px;pointer-events:auto;z-index:11;display:flex;gap:6px;align-items:center;transform:scale(var(--u,1));transform-origin:100% 0}
#shopBtn{position:relative;font-size:16px;padding:7px 12px;border:2px solid #f5c542}
#shopBtn b{display:none;position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:11px;background:#5fd068;border:2px solid #fff;font-size:13px;line-height:18px;animation:nud .8s infinite}
#shopBtn.can b{display:block}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#f5b82e 70%);border:2px solid #a8700f;vertical-align:-0.16em}
#stars{display:flex;justify-content:center;gap:6px;margin:-40px 0 0}
#wnPath i.b{font-size:16px}
#stars i{width:56px;height:56px;background:#2a1a2e;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#stars i:nth-child(2){transform:translateY(-10px) scale(1.18)}
#stars i.on{background:linear-gradient(#fff3a0,#f5b82e);animation:starIn .45s cubic-bezier(.3,1.8,.5,1) backwards}
#stars i.on:nth-child(2){animation-delay:.22s} #stars i.on:nth-child(3){animation-delay:.44s}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg)}}
#wnPath{display:flex;justify-content:center;align-items:center;gap:5px;margin:6px 0 4px}
#wnPath i{min-width:26px;height:26px;border-radius:13px;background:#2a1a2e;border:2px solid #7a5a8c;font-style:normal;font-size:12px;font-weight:900;line-height:22px;color:#a898b4;padding:0 3px}
#wnPath i.d{color:#2a1a2e}
#wnPath i.d{background:#f5c542;border-color:#fff}
#wnPath i.b{width:30px;height:30px;border-radius:15px;font-size:17px;line-height:25px;border-color:#ff7a5a}
#wnPath u{width:10px;height:3px;background:#7a5a8c;border-radius:2px}
#wnCoin{font-size:26px;font-weight:900;color:#ffe98a;margin:2px 0 4px}
#wnBtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#wnBtns .btn{margin-top:6px}
.srow{display:flex;align-items:center;gap:10px;text-align:left;background:#2a1a2e88;border-radius:16px;padding:8px 10px;margin:8px 0}
.srow canvas{width:44px;height:44px;flex:none}
.srow .si{flex:1;min-width:112px;font-size:16px;font-weight:900;line-height:1.25}
.srow .si small{display:block;font-size:14px;color:#ffe98a}
.srow .btn{font-size:18px;padding:9px 12px;margin:0;min-width:88px;white-space:nowrap}
#shopM .card{padding:14px 16px 16px}
#shopM{align-items:center;padding-bottom:0}
#skills{position:absolute;left:50%;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 0;display:flex;align-items:center;gap:8px;pointer-events:auto;height:42px}
#skills.none{visibility:hidden}
#skills button{position:relative;width:46px;height:40px;border-radius:13px;border:2px solid #fff;background:linear-gradient(#7a5a8c,#4a3256);box-shadow:0 3px 0 #2a1a2e;padding:0;cursor:pointer;flex:none}
#skills button canvas{width:28px;height:28px;display:block;margin:0 auto}
#skills button i{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:16px;border-radius:8px;background:#2a1a2e;border:1.5px solid #9fdcff;color:#9fdcff;font-style:normal;font-size:11px;font-weight:900;line-height:13px;padding:0 3px}
#skills button.off{filter:grayscale(.9) brightness(.62)}
#skills button.rdy{border-color:#ffe45c;box-shadow:0 3px 0 #2a1a2e,0 0 12px #ffe45c;animation:rdy 1s infinite}
#skills button.act{background:linear-gradient(#d9b8ff,#8b5cf6);border-color:#fff}
#skills button.lock{visibility:hidden}
@keyframes rdy{50%{transform:translateY(-3px)}}
#ebar{flex:1;height:16px;border-radius:9px;background:#2a1a2e;border:2px solid #1a1020;overflow:hidden;position:relative}
#ebar b{display:block;height:100%;width:0;background:linear-gradient(#bff3ff,#3fa8e8);transition:width .25s}
#ebar u{display:none}
#gearGrid{display:flex;justify-content:center;gap:5px;margin:6px 0 4px}
#gearGrid canvas{width:40px;height:40px;cursor:pointer;border-radius:10px}
#gearGrid canvas.on{outline:2px solid #fff}
#gearInfo{min-height:38px;font-size:14px;font-weight:800;line-height:1.3}
#shopM h3{margin:10px 0 0;font-size:15px;opacity:.85}
#lootM{align-items:center;padding-bottom:0}
#lootIc{width:92px;height:92px;display:block;margin:2px auto;animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
#lootNm{font-size:16px;font-weight:900} #lootSt{font-size:16px;font-weight:800;margin:2px 0 6px} #lootRs{font-size:15px;font-weight:800;color:#ffe98a;margin-bottom:4px}
#mini{position:absolute;right:8px;top:8px;pointer-events:auto;cursor:pointer;background:linear-gradient(#3a2a46,#241830);border:2px solid #c79a52;border-radius:12px;display:block;box-shadow:0 3px 0 #0006}
#dpad{position:absolute;left:50%;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 0;width:204px;height:204px;display:none;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:6px;padding:8px;border-radius:50%;background:radial-gradient(rgba(20,12,28,.9) 55%,rgba(20,12,28,0) 72%);pointer-events:auto}
#dpad.on{display:grid}
#dpad button{border:3px solid #fff;border-radius:16px;background:linear-gradient(#ffe98a,#f5b82e);box-shadow:0 4px 0 #8a5a10;color:#3a2440;font-size:26px;font-weight:900;cursor:pointer;padding:0;animation:rdy 1s infinite}
#dpad button:disabled{background:#3a2c44;border-color:#5a4a66;box-shadow:none;color:#5a4a66;animation:none;cursor:default}
#dpad button:active{transform:translateY(3px)}
#dpad button:nth-child(1){grid-area:1/2} #dpad button:nth-child(2){grid-area:2/1} #dpad button:nth-child(3){grid-area:2/3} #dpad button:nth-child(4){grid-area:3/2}
#mapM{align-items:center;padding-bottom:0}
#mapM .card{padding:12px 12px 14px}
#mapC{display:block;margin:6px auto 4px;max-width:100%;cursor:pointer}
#mapLg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:13px;font-weight:800;max-width:330px;margin:0 auto 4px}
#mapLg span{white-space:nowrap} #mapLg i{display:inline-block;width:11px;height:11px;border-radius:6px;margin-right:4px;vertical-align:-1px;border:1.5px solid #fff}
#cardM{align-items:center;padding-bottom:0}
#cardM .card{padding:14px 14px 16px}
#cards{display:flex;justify-content:center;gap:10px;margin:10px 0 8px}
.fc{width:90px;height:128px;border-radius:14px;border:3px solid #f5c542;background:repeating-linear-gradient(45deg,#6a3fd6,#6a3fd6 8px,#5a33c0 8px,#5a33c0 16px);color:#fff;font:inherit;font-weight:900;font-size:42px;cursor:pointer;padding:4px;box-shadow:0 5px 0 #2a1a2e}
.fc.back{animation:rdy 1.1s infinite} .fc.back:nth-child(2){animation-delay:.18s} .fc.back:nth-child(3){animation-delay:.36s}
.fc.up{background:#3a2c44;font-size:13px;line-height:1.25;animation:flip .35s;cursor:default}
.fc.pick{border-color:#fff;box-shadow:0 5px 0 #2a1a2e,0 0 16px #ffe45c}
.fc.dim{opacity:.6}
.fc canvas{width:54px;height:54px;display:block;margin:2px auto 4px}
.fc .coin{font-size:34px;display:block;margin:10px auto 8px}
.fc b{display:block;font-size:19px;color:#ffe98a}
@keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
#cardRs{min-height:22px;font-size:15px;font-weight:800;color:#ffe98a;margin-bottom:2px}
#cardBtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;visibility:hidden} #cardBtns.on{visibility:visible}
#cardBtns .btn{margin-top:6px;font-size:20px;padding:11px 20px}
#gearBtn{padding:3px 6px;border:2px solid #c79a52;line-height:0}
#gearBtn canvas{width:26px;height:26px}
#lootCmp{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0}
.lc{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:800;max-width:130px}
#lootOld{width:60px;height:60px;margin:18px 0 4px;opacity:.85}
#lootArrow{font-size:26px;color:#ffe98a}
#lootDoll{width:150px;height:118px;display:block;margin:0 auto}
#lootBtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btn.sec{background:linear-gradient(#8a7a9a,#5a4a6a);box-shadow:0 5px 0 #2a1a2e;font-size:20px}
#gearM{align-items:center;padding-bottom:0}
#gearM .card{padding:12px 12px 14px}
#gearBody{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0}
.gcol{display:flex;flex-direction:column;gap:5px}
.gslot{display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:11px;font-weight:800;width:58px}
.gslot canvas{width:44px;height:44px}
.gslot.on canvas{filter:drop-shadow(0 0 6px #ffe45c)}
#gearDoll{width:150px;height:210px}
#gearInfo2{min-height:20px;font-size:14px;font-weight:900}
#gearSum{font-size:13px;font-weight:800;color:#ffe98a;max-width:300px;margin:2px auto 0;line-height:1.45}
#floorT{position:fixed;inset:0;z-index:26;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#2a1c34,#07040a 75%);opacity:0;pointer-events:none;transition:opacity .35s}
#floorT.show{opacity:1;pointer-events:auto}
#ftC{width:300px;height:200px;transform:scale(var(--u,1));margin-bottom:calc(20px * var(--u,1))}
#ftFrom{font-size:20px;font-weight:900;color:#ffe98a;opacity:.8;transform:scale(var(--u,1))}
#ftTo{font-size:40px;font-weight:900;margin-top:6px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
#ftTo.pop{transform:scale(var(--u,1))}
#ftSub{font-size:19px;font-weight:800;color:#ffb09a;opacity:0;transition:opacity .4s;margin-top:calc(10px * var(--u,1));transform:scale(var(--u,1))}
#ftSub.on{opacity:1}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1220;z-index:20;font-size:22px;font-weight:800}
#loading .bar{width:220px;height:10px;background:#ffffff22;border-radius:6px;margin-top:12px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#f5c542;animation:ld 1s infinite alternate}
@keyframes ld{to{width:100%}}
#adfake{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:24px;z-index:30;pointer-events:auto}
@media (max-width:600px){ #lvl{font-size:18px;top:54px;left:10px;transform:none;padding:4px 12px} #banner{font-size:19px} #tut{font-size:14px} #btns button{width:56px;height:56px;font-size:24px} }
/* Poki pill sits at top centre: keep the level chip clear of it */
body.pf-poki #lvl{top:70px}
@media (max-width:600px){ body.pf-poki #lvl{top:100px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="pref"><button class="rb" id="sndBtn">🔊</button><select id="langSel"></select></div>
  <div id="lvl" class="out"><span id="lvlIc"></span> <span id="lvlTx"></span></div>
  <div id="skills"><button id="sk1"><canvas width="56" height="56"></canvas><i>100</i></button><div id="ebar"><b></b><u></u></div><button id="sk2"><canvas width="56" height="56"></canvas><i>100</i></button></div>
  <canvas id="mini" width="10" height="10"></canvas>
  <div id="dpad"><button data-d="0,-1">▲</button><button data-d="-1,0">◀</button><button data-d="1,0">▶</button><button data-d="0,1">▼</button></div>
  <div id="banner" class="out"></div>
  <div id="tut"></div>
  <div id="btns"><button id="bUndo">↩️<i id="undoN">5</i></button><button id="bRestart">🔄</button><button id="bAdd">🧪<i class="ad">📺</i></button><button id="bHint">💡<i class="ad">📺</i></button></div>
</div>
<div id="coinBox"><button class="rb" id="gearBtn"><canvas width="48" height="48"></canvas></button><button class="rb" id="shopBtn"><span class="coin"></span> <span id="coinN">0</span><b>⬆</b></button></div>
<div class="modal" id="winM"><div class="card"><div id="stars"><i></i><i></i><i></i></div><h2 class="out" data-t="victory"></h2><div id="wnSub"></div><div id="wnPath"></div><div id="wnCoin" class="out">+<span id="wnCoinN">0</span> <span class="coin"></span></div><div id="wnBtns"><button class="btn ad" id="wnDbl">📺 ×2</button><button class="btn" id="wnNext" data-t="next"></button></div></div></div>
<div class="modal" id="shopM"><div class="card"><h2 class="out" data-t="gear"></h2><div id="shopRows"></div><button class="btn" id="shopX">OK</button></div></div>
<div class="modal" id="mapM"><div class="card"><h2 class="out" data-t="route"></h2><canvas id="mapC" width="10" height="10"></canvas><div id="mapLg"></div><button class="btn" id="mapX">OK</button></div></div>
<div class="modal" id="cardM"><div class="card"><h2 class="out" data-t="pickCard"></h2><div id="cards"></div><div id="cardRs"></div><div id="cardBtns"><button class="btn ad" id="cardAgain" data-t="again"></button><button class="btn" id="cardOk" data-t="next"></button></div></div></div>
<div class="modal" id="lootM"><div class="card"><h2 class="out" data-t="loot"></h2><div id="lootCmp"><div class="lc"><canvas id="lootOld" width="120" height="120"></canvas><span id="lootOldNm"></span></div><div id="lootArrow">➜</div><div class="lc"><canvas id="lootIc" width="200" height="200"></canvas><span id="lootNm" class="out"></span></div></div><div id="lootSt"></div><canvas id="lootDoll" width="10" height="10"></canvas><div id="lootRs"></div><div id="lootBtns"><button class="btn" id="lootEq" data-t="wear"></button><button class="btn" id="lootSell"></button></div><button class="btn" id="lootOk" data-t="next"></button></div></div>
<div class="modal" id="gearM"><div class="card"><h2 class="out" data-t="myGear"></h2><div id="gearBody"><div class="gcol" id="gcolL"></div><canvas id="gearDoll" width="10" height="10"></canvas><div class="gcol" id="gcolR"></div></div><div id="gearInfo2"></div><div id="gearSum"></div><button class="btn" id="gearX">OK</button></div></div>
<div id="floorT"><canvas id="ftC" width="10" height="10"></canvas><div id="ftFrom" class="out"></div><div id="ftTo" class="out"></div><div id="ftSub" class="out"></div></div>
<div class="modal" id="loseM"><div class="card"><div id="wnIc">💫</div><h2 class="out" data-t="dead"></h2><button class="btn ad" id="lsRevive" data-t="revive"></button><button class="btn" id="lsRetry" data-t="retry"></button></div></div>
<div id="adfake"></div>
<div id="loading"><div>Dungeon Tavern</div><div class="bar"><i></i></div></div>
