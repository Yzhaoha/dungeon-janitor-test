<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Tavern</title>
<!--PLATFORM_HEAD-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{text-shadow:0 2px 0 #2a1a2e,0 0 4px #2a1a2e,1px 1px 0 #2a1a2e,-1px -1px 0 #2a1a2e,1px -1px 0 #2a1a2e,-1px 1px 0 #2a1a2e}
#hud{position:fixed;inset:0;pointer-events:none}
#pref{position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:auto}
.rb{pointer-events:auto;border:none;border-radius:12px;background:rgba(40,24,48,.8);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:7px 10px;cursor:pointer}
#langSel{pointer-events:auto;background:rgba(40,24,48,.8);color:#fff;border:none;border-radius:12px;font:inherit;font-weight:800;font-size:14px;padding:6px 4px;max-width:104px}
#lvl{position:absolute;left:50%;top:9px;transform:translateX(-50%);background:rgba(40,24,48,.78);border:2px solid #f5c542;border-radius:20px;padding:4px 16px;font-size:20px;font-weight:900;white-space:nowrap}
#banner{position:absolute;left:50%;top:17%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);text-align:center;font-size:30px;font-weight:900;white-space:nowrap}
#banner small{display:block;font-size:17px;font-weight:700;margin-top:4px;white-space:normal;max-width:86vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tut{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:max-content;background:#fff;color:#3a2440;border-radius:18px;padding:9px 16px;font-size:18px;font-weight:800;max-width:90vw;text-align:center;box-shadow:0 5px 0 #0005;display:none;border:3px solid #ffd84a}
#tut.show{display:block}
#btns{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto}
#btns button{position:relative;width:62px;height:62px;border-radius:20px;border:3px solid #fff;background:linear-gradient(#7a5a8c,#4a3256);box-shadow:0 5px 0 #2a1a2e;color:#fff;font:inherit;font-size:27px;cursor:pointer;padding:0;transition:transform .08s}
#btns button:active{transform:translateY(4px);box-shadow:0 1px 0 #2a1a2e}
#btns button i{position:absolute;right:-7px;top:-9px;min-width:24px;height:24px;border-radius:12px;background:#ff5a4a;border:2px solid #fff;font-style:normal;font-size:13px;font-weight:900;line-height:20px;padding:0 4px}
#btns button i.ad{background:#8b5cf6;font-size:12px}
#btns.nudge #bUndo,#btns.nudge #bAdd{animation:nud .5s 3}
@keyframes nud{50%{transform:translateY(-8px) scale(1.08)}}
.modal{position:fixed;inset:0;background:#120a1855;display:none;align-items:flex-end;justify-content:center;pointer-events:auto;z-index:10;padding-bottom:9vh}
.modal.show{display:flex}
.card{background:linear-gradient(#4a3256,#33213d);border:3px solid #f5c542;border-radius:24px;padding:14px 30px 18px;min-width:250px;max-width:92vw;text-align:center;box-shadow:0 8px 0 #0006;animation:cardIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{0%{transform:translateY(60px) scale(.8);opacity:0}}
.card h2{margin:0 0 2px;font-size:30px}
#wnIc{font-size:46px;line-height:1.1}
#wnSub{font-size:17px;font-weight:800;opacity:.85;margin-bottom:8px}
.btn{border:none;border-radius:18px;font:inherit;font-weight:900;font-size:24px;padding:12px 40px;margin:6px 4px 0;cursor:pointer;color:#fff;background:linear-gradient(#5fd068,#33a144);box-shadow:0 5px 0 #1f6b2b}
.btn.ad{background:linear-gradient(#9b6bff,#6a3fd6);box-shadow:0 5px 0 #3d2380;font-size:20px;padding:11px 22px}
.btn:disabled{filter:grayscale(1);opacity:.6}
#loseM .btn{display:block;margin:8px auto 0;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1f6b2b}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1220;z-index:20;font-size:22px;font-weight:800}
#loading .bar{width:220px;height:10px;background:#ffffff22;border-radius:6px;margin-top:12px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#f5c542;animation:ld 1s infinite alternate}
@keyframes ld{to{width:100%}}
#adfake{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:24px;z-index:30;pointer-events:auto}
@media (max-width:600px){ #lvl{font-size:19px;top:54px} #banner{font-size:24px;top:21%} #tut{font-size:16px} #btns button{width:56px;height:56px;font-size:24px} }
/* Poki pill sits at top centre: keep the level chip clear of it */
body.pf-poki #lvl{top:70px}
@media (max-width:600px){ body.pf-poki #lvl{top:100px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="pref"><button class="rb" id="sndBtn">🔊</button><select id="langSel"></select></div>
  <div id="lvl" class="out"><span id="lvlIc"></span> <span id="lvlTx"></span></div>
  <div id="banner" class="out"></div>
  <div id="tut"></div>
  <div id="btns"><button id="bUndo">↩️<i id="undoN">5</i></button><button id="bRestart">🔄</button><button id="bAdd">🧪<i class="ad">📺</i></button><button id="bHint">💡<i class="ad">📺</i></button></div>
</div>
<div class="modal" id="winM"><div class="card"><div id="wnIc">🏆</div><h2 class="out" data-t="victory"></h2><div id="wnSub"></div><button class="btn" id="wnNext" data-t="next"></button></div></div>
<div class="modal" id="loseM"><div class="card"><div id="wnIc">💫</div><h2 class="out" data-t="dead"></h2><button class="btn ad" id="lsRevive" data-t="revive"></button><button class="btn" id="lsRetry" data-t="retry"></button></div></div>
<div id="adfake"></div>
<div id="loading"><div>Dungeon Tavern</div><div class="bar"><i></i></div></div>
