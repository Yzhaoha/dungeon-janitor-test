.fc{position:relative;width:82px;height:120px;cursor:pointer;animation:deal .55s cubic-bezier(.25,1.4,.5,1) backwards}
.fc:nth-child(1){--dx:120px;animation-delay:.05s} .fc:nth-child(2){--dx:40px;animation-delay:.18s} .fc:nth-child(3){--dx:-40px;animation-delay:.31s} .fc:nth-child(4){--dx:-120px;animation-delay:.44s}
@keyframes deal{0%{transform:translate(var(--dx),-70vh) rotate(-35deg) scale(.4);opacity:0}70%{opacity:1}}
.fci{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.fc.up .fci{transform:rotateY(180deg)}
.fc.pick{z-index:2} .fc.pick .fci{transform:rotateY(180deg) scale(1.14)}
.fc:not(.up):hover .fci,.fc:not(.up):active .fci{transform:translateY(-8px)}
.fcb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fcb.bk{background:#5a1420 center/cover no-repeat;border:3px solid #e8b44a;box-shadow:0 6px 0 #1a0a10,0 0 14px #ffb04a55}
.fcb.bk:after{content:'';position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,240,200,.45),transparent);transform:skewX(-20deg);animation:shine 2.4s infinite}
.fc:nth-child(2) .fcb.bk:after{animation-delay:.3s} .fc:nth-child(3) .fcb.bk:after{animation-delay:.6s} .fc:nth-child(4) .fcb.bk:after{animation-delay:.9s}
@keyframes shine{0%{left:-60%}45%,100%{left:130%}}
.fcb.fr{transform:rotateY(180deg);background:linear-gradient(#3a2c44,#1e1428);border:3px solid var(--rc,#e9e9f0);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1.25;color:#fff;text-align:center;padding:2px;box-shadow:0 0 18px var(--rc,#fff)}
.fcb.fr:before{content:'';position:absolute;left:50%;top:42%;width:260%;height:260%;margin:-130% 0 0 -130%;background:repeating-conic-gradient(var(--rc,#fff) 0 8deg,transparent 8deg 22deg);opacity:var(--ra,.15);animation:rays 6s linear infinite}

// ===== SIM START =====
// v0.8 — Potion Brawl: sort potions; every bottle you complete is drunk by the hero and becomes a move
// (attack / shield / heal / stun / poison) against the monster, which strikes back every few pours.
// Pure logic (node can run it): level generator (always solvable), move rules, solver for hints.
var DJ = (function(){
'use strict';
var CAP = 4, MAXC = 12;
function rnd(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
// A floor is several rooms in a row: 3 on a normal floor, 5 on a boss floor (every 6th), 7 on a great-boss floor (every 24th).
// Only the last room of a boss floor holds the boss; the hero's health carries from room to room.
function kindOf(l){ return l%24===0 ? 'big' : (l%6===0 ? 'boss' : 'n'); }
function stagesOf(l){ return {n:3, boss:5, big:7}[kindOf(l)]; }
// who waits in a room: t is the room type from the floor map ('f' fight, 'e' elite, 'B' the floor's boss room:
// a mini boss on a normal floor, the boss or the great boss on boss floors)
function roleOf(l,s,t){ return t==='B' ? (kindOf(l)==='n' ? 'mini' : kindOf(l)) : (t==='e' ? 'mini' : 'min'); }
function isKing(l){ return kindOf(l)!=='n'; }
function colorsFor(l,s,t){
  if (l===1) return s===0 ? 2 : 3;
  var steps=[[1,3],[2,4],[3,5],[6,6],[11,7],[17,8],[27,9],[41,10],[61,11]], c=3, r=roleOf(l,s||0,t);
  steps.forEach(function(q){ if (l>=q[0]) c=q[1]; });
  if (r==='boss') c+=1; else if (r==='big') c+=2; else if (t==='B' && l>=3) c+=1; else if (kindOf(l)!=='n') c-=2;   // the rooms before a boss are quick ones
  return Math.max(3, Math.min(MAXC, c));
}
// mystery layers: only the top of each bottle is known until it is uncovered
function hiddenFor(l,s,t){ return l>=10 && roleOf(l,s||0,t)==='min' && (l+(s||0))%3===2; }
// The floor map is a small grid of rooms joined by doors, like a dungeon crawler's minimap. A winding main corridor of
// stagesOf(l) rooms runs from the entrance to the boss room (no shortcuts); side rooms hang off it: an elite, or a plain
// fight guarding a chest or a resting place. Rooms: {x,y,t,links,main}.
function mapOf(l){
  var n=stagesOf(l), W= n<=3 ? 3 : (n<=5 ? 4 : 5), H= l===1 ? 1 : (n<=3 ? 2 : 3), r, rooms, grid, path, at;
  var D=[[1,0],[0,1],[0,-1],[-1,0]], free=function(x,y){ return x>=0 && y>=0 && x<W && y<H && grid[y*W+x]==null; };
  for (var tries=0; tries<200; tries++){ r=rnd(l*4513+tries*7717+99); grid=[]; path=[];
    var walk=function(x,y){ grid[y*W+x]=path.length; path.push([x,y]);
      if (path.length===n){ if (x===W-1) return true; }
      else { var ds=D.slice(0,3).sort(function(){ return r()-0.5; }); if (r()<0.75){ ds.sort(function(p,q){ return q[0]-p[0]; }); }
        for (var i=0;i<ds.length;i++) if (free(x+ds[i][0],y+ds[i][1]) && walk(x+ds[i][0],y+ds[i][1])) return true; }
      path.pop(); grid[y*W+x]=null; return false; };
    if (walk(0, Math.floor(r()*H))) break; }
  rooms=path.map(function(p,i){ return {x:p[0], y:p[1], t:i===n-1?'B':'f', main:i, links:[]}; });
  for (at=0; at<n-1; at++){ rooms[at].links.push(at+1); rooms[at+1].links.push(at); }
  var add=function(from,x,y,t){ var id=rooms.length; grid[y*W+x]=id; rooms.push({x:x, y:y, t:t, main:-1, links:[from]}); rooms[from].links.push(id); return id; };
  var spots=function(id){ return D.map(function(d){ return [rooms[id].x+d[0], rooms[id].y+d[1]]; }).filter(function(q){ return free(q[0],q[1]); }); };
  for (var k=0, sides= l===1 ? 0 : (n<=3 ? 1 : (n<=5 ? 2 : 3)); k<sides; k++){
    var cand=[]; for (at=0; at<n-1; at++) if (spots(at).length) cand.push(at);
    if (!cand.length) break; var from=cand[Math.floor(r()*cand.length)], sp=spots(from), q=sp[Math.floor(r()*sp.length)];
    if (r()<0.5) add(from,q[0],q[1],'e');
    else { var g=add(from,q[0],q[1],'f'), sp2=spots(g); if (sp2.length){ var q2=sp2[Math.floor(r()*sp2.length)]; add(g,q2[0],q2[1], r()<0.5?'c':'r'); } else rooms[g].t='e'; } }
  return {w:W, h:H, n:n, rooms:rooms};
}

function top(b){ return b[b.length-1]; }
function uniform(b){ for (var i=1;i<b.length;i++) if (b[i]!==b[0]) return false; return true; }
function done(b){ return b.length===0 || (b.length===CAP && uniform(b)); }
function solved(B){ for (var i=0;i<B.length;i++) if (!done(B[i])) return false; return true; }
function canPour(B,i,j){ var a=B[i], b=B[j]; return i!==j && a.length>0 && b.length<CAP && (b.length===0 || top(b)===top(a)); }
function run(b){ var n=1; for (var i=b.length-2;i>=0 && b[i]===top(b);i--) n++; return n; }
function pourN(B,i,j){ return Math.min(run(B[i]), CAP-B[j].length); }
function pour(B,i,j){ var n=pourN(B,i,j), c=top(B[i]); for (var k=0;k<n;k++){ B[i].pop(); B[j].push(c); } return n; }
// moves worth trying (skips the pointless ones)
function moves(B){
  var out=[], emptySeen;
  for (var i=0;i<B.length;i++){ var a=B[i]; if (!a.length || (a.length===CAP && uniform(a))) continue; emptySeen=false;
    for (var j=0;j<B.length;j++){ if (!canPour(B,i,j)) continue;
      if (B[j].length===0){ if (emptySeen || uniform(a)) continue; emptySeen=true; out.push([i,j,1]); }
      else { if (pourN(B,i,j)<run(a) && uniform(a)) continue; out.push([i,j,0]); } } }
  out.sort(function(x,y){ return x[2]-y[2]; });
  return out;
}
function key(B){ return B.map(function(b){ return b.join(','); }).sort().join('|'); }
// depth-first search with a node budget; returns a list of [from,to] or null
function solve(B0, budget){
  var B=B0.map(function(b){ return b.slice(); }), seen={}, path=[], nodes=0, lim=budget||60000;
  function dfs(){
    if (solved(B)) return true;
    if (++nodes>lim) return false;
    var k=key(B); if (seen[k]) return false; seen[k]=1;
    var ms=moves(B);
    for (var m=0;m<ms.length;m++){ var i=ms[m][0], j=ms[m][1], n=pour(B,i,j); path.push([i,j]);
      if (dfs()) return true;
      path.pop(); var c=top(B[j]); for (var q=0;q<n;q++){ B[j].pop(); B[i].push(c); }
      if (nodes>lim) return false; }
    return false;
  }
  return dfs() ? path : null;
}
// how often a careless player (random sensible pours) fails to finish this layout: 0 = can't go wrong, 1 = a real trap
function trapRate(B0, steps, r){
  var fails=0, N=16;
  for (var t=0;t<N;t++){ var B=B0.map(function(b){ return b.slice(); }), ok=false;
    for (var m=0;m<steps*3+10;m++){ if (solved(B)){ ok=true; break; } var ms=moves(B); if (!ms.length) break; var mv=ms[Math.floor(r()*ms.length)]; pour(B,mv[0],mv[1]); }
    if (!ok) fails++; }
  return fails/N;
}
// Several shuffles are tried and the trickier ones are kept: early floors take a middling one, later floors the nastiest.
function gen(level, stage, lane, type){
  stage=stage||0; lane=lane||0; var nc=colorsFor(level,stage,type), cands=[], want= level<3 ? 1 : 7;
  for (var att=0; att<90 && cands.length<want; att++){
    var r=rnd(level*7919+stage*15485863+lane*31337+att*104729+17), units=[], i, c;
    for (c=0;c<nc;c++) for (i=0;i<CAP;i++) units.push(c);
    for (i=units.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=units[i]; units[i]=units[j]; units[j]=t; }
    var B=[]; for (c=0;c<nc;c++) B.push(units.slice(c*CAP,(c+1)*CAP));
    B.push([]); B.push([]);
    if (B.some(function(b){ return b.length && uniform(b); })) continue;        // nothing pre-sorted
    var sol=solve(B, 40000); if (!sol) continue;
    if (level>1 && sol.length<nc*2) continue;                                   // too easy, reshuffle
    cands.push({B:B, steps:sol.length, trap: want>1 ? trapRate(B, sol.length, r) : 0});
  }
  if (!cands.length) return null;
  cands.sort(function(x,y){ return (x.trap-y.trap) || (x.steps-y.steps); });
  var pick=cands[Math.min(cands.length-1, Math.floor((cands.length-1)*Math.min(1, 0.35+level/30)+0.5))];
  var L={level:level, stage:stage, stages:stagesOf(level), kind:kindOf(level), role:roleOf(level,stage,type), final:type==='B', colors:nc, hidden:hiddenFor(level,stage,type), bottles:pick.B, steps:pick.steps, trap:pick.trap};
  L.king=L.role==='boss'||L.role==='big'; L.elite=L.role==='mini';
  L.fight=fight(L); L.fight.mHp=L.fight.mMax; return L;
}
// ---------- fight ----------
// what a full bottle of each colour does (same order as the palette in game.js)
// ordered so that from 4 colours on there are always at least two attack potions (a fight is never one hit long)
var ROLE=['atk','shd','heal','atk','stun','psn','atk','shd','atk','heal','stun','psn'];
// The monster's hit is sized so that a whole floor, played along the solver's line with no upgrades, costs less than the hero's
// 100 health: each room gets a share of that budget (the boss room the biggest one).
function fight(L){
  var na=0, i; for (i=0;i<L.colors;i++) if (ROLE[i]==='atk'||ROLE[i]==='psn') na++;
  var ATK=25, interval=L.level<4?6:5, hits=Math.ceil(L.steps*1.4/interval)+1;
  var w= L.kind==='n' ? (L.final? 0.85 : 0.55) : (L.kind==='boss' ? (L.role==='boss'?1.05:0.3) : (L.role==='big'?1.1:0.22));
  if (L.elite && !L.final) w*=1.4;
  var hpK=1.3*Math.min(2,1+0.01*(L.level-1))*(L.role==='big'?1.3:(L.role==='boss'?1.1:(L.role==='mini'?1.15:1)));
  return {atk:ATK, heroMax:100, hHp:100, shield:0, heal:35, stun:4, psn:3, poison:0, def:0, crit:0, par:L.steps, moves:0, strikes:0, heavy:L.role!=='min',
    mMax:Math.max(20, Math.round(ATK*na*hpK/5)*5), mHp:0, interval:interval, cd:interval, mDmg:Math.max(4, Math.ceil(100*w/hits))};
}
// Fewer pours = harder hits: every room starts at x1.5 power and slides to normal by the time the solver's own
// number of pours is used up.
function power(F){ return Math.max(1, Math.min(1.5, 1.5-0.5*F.moves/F.par)); }
// bosses, mini bosses and elites wind up a heavy blow on every third strike (a shield still stops it)
function isHeavy(F, n){ return !!F.heavy && n%3===0; }
function nextHeavy(F){ return isHeavy(F, (F.strikes||0)+1); }
// a completed bottle of colour c is drunk
function drink(F, c){

// after every pour: poison ticks, the countdown drops, the monster may strike

})();

  tutA2:['Tap a bottle, then another to pour. Fill a bottle with one colour and the hero drinks it to attack!','Touche une bouteille, puis une autre pour verser. Une bouteille d\'une seule couleur : le héros la boit et attaque !','Tocca una bottiglia, poi un\'altra per versare. Riempine una di un solo colore: l\'eroe la beve e attacca!','Tippe eine Flasche, dann eine andere zum Umgießen. Eine Flasche in einer Farbe: Der Held trinkt sie und greift an!','Toca una botella y luego otra para verter. Llena una de un solo color: ¡el héroe la bebe y ataca!','Bir şişeye, sonra başka birine dokunup dök. Tek renkle dolan şişeyi kahraman içer ve saldırır!','点一个瓶子，再点另一个，把药水倒过去。凑满一瓶同色的，勇者就会喝掉出招！','ビンをタップ、次のビンをタップで注ぐ。1色でいっぱいにすると勇者が飲んで攻撃！','병을 누르고 다른 병을 눌러 부으세요. 한 가지 색으로 채우면 용사가 마시고 공격해요!','Toque numa garrafa e depois noutra para despejar. Encha uma com uma só cor: o herói bebe e ataca!','Нажми на бутылку, затем на другую — перелей. Заполни одним цветом: герой выпьет и ударит!'],

  for (i=1;i<=6;i++){ if (i>1) p.appendChild(document.createElement('u')); var d=document.createElement('i'); d.textContent=b+i; if (b+i<=L.level){ d.className='d'; } if (i===6){ d.className+=' b'; d.textContent=(b+6<=L.level)?'✓':((b+6)%24===0?'🐉':'👹'); } p.appendChild(d); }
  $('wnCoinN').textContent=lastReward; $('wnDbl').style.display=''; $('wnDbl').disabled=false;
  $('winM').classList.add('show'); updHud(); Snd.coin();
}
$('wnDbl').onclick=function(){ var b=this; if (PF.adBusy) return; b.disabled=true; PF.rewarded(function(ok){ if (!ok){ b.disabled=false; return; } SAVE.coins+=lastReward; saveNow(); $('wnCoinN').textContent=lastReward*2; b.style.display='none'; updHud(); Snd.buy(); }); };
var UPS=[{k:'s',n:'u_sw',ic:'atk',col:'#ff8a7a',st:function(l){ return ''+(25+5*l); }},{k:'a',n:'u_ar',ic:'shd',col:'#6aa8ff',st:function(l){ return 'HP '+(100+10*l); }},{k:'h',n:'u_el',ic:'heal',col:'#8df07a',st:function(l){ return '+'+(35+6*l); }}];
function drawShop(){
  var box=$('shopRows'); box.innerHTML='';
  UPS.forEach(function(u){ var lv=SAVE.up[u.k], max=lv>=UPMAX, cost=upCost(lv), row=document.createElement('div'); row.className='srow';
    var cvs=document.createElement('canvas'); cvs.width=cvs.height=88; var c2=cvs.getContext('2d'); c2.fillStyle='#4a3256'; c2.beginPath(); c2.arc(44,44,42,0,6.3); c2.fill(); icon(c2,u.ic,44,44,24,u.col,5);

// ---------------- input ----------------
addEventListener('keydown', function(e){ Snd.unlock(); var dk={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[e.code]; if (dk){ e.preventDefault(); if (choosing) goDir(dk[0],dk[1]); return; } if (e.code==='KeyZ') undo(); if (e.code==='KeyR') restart(); if ((e.code==='Enter'||e.code==='Space') && $('winM').classList.contains('show')) $('wnNext').click(); });

  if (choosing){ var dh0=null; doorHits.forEach(function(h){ if (Math.hypot(h.x-e.clientX,h.y-e.clientY)<=h.r && (!dh0 || Math.hypot(h.x-e.clientX,h.y-e.clientY)<Math.hypot(dh0.x-e.clientX,dh0.y-e.clientY))) dh0=h; }); if (dh0){ Snd.pop(); pickRoom(dh0.id); } return; }
  var x=e.clientX, y=e.clientY, hit=-1, best=1e9;

  if (hit>=0) tap(hit); else if (sel>=0){ sel=-1; }

// ---------------- frame ----------------
var last=performance.now(), frameN=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000)*(window.__ts||1); last=now;
  PF.setPlaying(!won && !lost && !choosing && !PF.adBusy && !document.hidden && moved>0 && !$('shopM').classList.contains('show'));
  draw(dt); updPad(); if (((frameN=(frameN|0)+1)&7)===0) drawMap($('mini'), false);
  if (lost && !anims.length && !laters.length && !$('loseM').classList.contains('show')){ sel=-1; $('lsRevive').disabled=false; $('loseM').classList.add('show'); Snd.thud(); }
  if (won && !anims.length && !laters.length && winT===0){ winT=now; sel=-1; setTut(''); afterKill(); }
  if (walk>0){ walk+=dt; if (walk>=0.9){ var nr=nodeAt(nextRoom); if (!RT.done[nextRoom] && nr.t!=='r' && nr.t!=='c') enterRoom(nextRoom, carryHp); else arrive(nextRoom); } }
  if (!won && !lost && !anims.length && V.some(function(w){ return w.lock>0; })){ var anyMove=false; for (var a1=0;a1<B.length && !anyMove;a1++) for (var a2=0;a2<B.length;a2++) if (pourCount(a1,a2)>0){ anyMove=true; break; } if (!anyMove){ var hadLock=false; for (var a3=0;a3<B.length;a3++) if (V[a3].lock>0){ V[a3].lock=0; V[a3].unlk=0.5; hadLock=true; } if (hadLock) Snd.clank(); } }
  if (!won){ winT=0; if (!lost && !anims.length && !stuckShown && moved>0 && DJ.stuck(B)){ stuckShown=true; toast(tl('stuck')); Snd.nope(); $('btns').classList.remove('nudge'); void $('btns').offsetWidth; $('btns').classList.add('nudge'); } }
}

function boot(){

  DPR=Math.min(window.devicePixelRatio||1, 2); VW=innerWidth; VH=innerHeight; cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  startFloor(SAVE.level, Math.min(DJ.stagesOf(SAVE.level), +QS.get('stage')||0));
  if (DEBUG && QS.has('ending')) setTimeout(function(){ playEnding(function(){}); }, 600);
  $('loading').style.display='none'; PF.loaded();
  if (DEBUG){ window.__DJ=DJ; window.__PF=PF; window.__S={get B(){ return B; }, get V(){ return V; }, get L(){ return L; }, get won(){ return won; }, get lost(){ return lost; }, get F(){ return F; }, get laters(){ return laters; }, get SAVE(){ return SAVE; }, get anims(){ return anims; }, get bw(){ return bw; }, get bh(){ return bh; }, tap:tap, flush:flush, load:loadLevel, get doors(){ return doorHits; }, get RT(){ return RT; }, get choosing(){ return choosing; }, options:options, pick:pickRoom, get stage(){ return curStage; }, get walk(){ return walk; }, set energy(v){ energy=v; updSkills(); }, get energy(){ return energy; }}; }
  requestAnimationFrame(function(n){ last=n; frame(n); });
}
