<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Tavern</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.out{text-shadow:0 2px 0 #2a1a2e,0 0 4px #2a1a2e,1px 1px 0 #2a1a2e,-1px -1px 0 #2a1a2e,1px -1px 0 #2a1a2e,-1px 1px 0 #2a1a2e}
#hud{position:fixed;inset:0;pointer-events:none}
#coinBox{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(40,24,48,.72);border:2px solid #f5c542;border-radius:22px;padding:4px 14px 4px 6px;font-size:24px;font-weight:900}
#coinBox .ico,.coinfly{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f8c630 45%,#c98a10);box-shadow:inset 0 -2px 0 #9a6608,0 1px 2px #0006;display:inline-block}
#coinBox.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
#wave{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(40,24,48,.72);border-radius:16px;padding:5px 14px;font-size:17px;font-weight:800;white-space:nowrap;text-align:center}
#wave .bar{height:5px;background:#ffffff22;border-radius:3px;margin-top:4px;overflow:hidden}
#wave .bar i{display:block;height:100%;background:#7ee06a;width:0}
#wave.soon .bar i{background:#ff7a59}
#rep{position:absolute;right:12px;top:10px;background:rgba(40,24,48,.72);border-radius:16px;padding:5px 12px;font-size:20px;letter-spacing:1px;color:#ffd84a;display:flex;align-items:center;gap:8px}
#rep small{color:#fff;font-size:13px;letter-spacing:0}
#topBtns{position:absolute;right:12px;top:52px;display:flex;gap:6px;pointer-events:auto}
.rb{pointer-events:auto;border:none;border-radius:12px;background:rgba(40,24,48,.8);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:6px 10px;cursor:pointer}
#boostBtn{position:absolute;right:12px;bottom:18px;pointer-events:auto;border:3px solid #fff;border-radius:18px;background:linear-gradient(#9b6bff,#6a3fd6);color:#fff;font:inherit;font-weight:900;font-size:16px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 #3d2380;text-align:center;line-height:1.1}
#boostBtn small{display:block;font-size:11px;opacity:.9}
#boostBtn.on{background:linear-gradient(#ffcf4a,#f29a1a);box-shadow:0 4px 0 #9a5a08}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);text-align:center;font-size:36px;font-weight:900;white-space:nowrap}
#banner small{display:block;font-size:17px;font-weight:700;margin-top:4px;white-space:normal;max-width:86vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tut{white-space:pre-line;position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:max-content;background:#fff;color:#3a2440;border-radius:18px;padding:10px 18px;font-size:19px;font-weight:800;max-width:88vw;text-align:center;box-shadow:0 5px 0 #0005;display:none;border:3px solid #ffd84a}
#tut.show{display:block;animation:pop .3s}
@keyframes pop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
.float{position:absolute;font-weight:900;font-size:20px;color:#ffe45c;pointer-events:none;transition:transform 1s ease-out,opacity 1s;white-space:nowrap}
.coinfly{position:absolute;width:20px;height:20px;transition:left .55s cubic-bezier(.5,-0.3,.7,1),top .55s cubic-bezier(.3,0,.2,1),transform .55s;pointer-events:none}
.modal{position:fixed;inset:0;background:#120a18aa;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:10}
.modal.show{display:flex}
.card{background:linear-gradient(#4a3256,#33213d);border:3px solid #f5c542;border-radius:22px;padding:18px 20px;min-width:280px;max-width:92vw;text-align:center;box-shadow:0 8px 0 #0006}
.card h2{margin:0 0 8px;font-size:26px}
.card .big{font-size:34px;font-weight:900;color:#ffe45c;margin:6px 0}
.btn{border:none;border-radius:16px;font:inherit;font-weight:900;font-size:19px;padding:11px 18px;margin:6px 4px 0;cursor:pointer;color:#fff;background:linear-gradient(#5fd068,#33a144);box-shadow:0 4px 0 #1f6b2b}
.btn.ad{background:linear-gradient(#9b6bff,#6a3fd6);box-shadow:0 4px 0 #3d2380}
.btn.gray{background:#6b5a75;box-shadow:0 4px 0 #3a2f40}
.btn:disabled{filter:grayscale(1);opacity:.6}
#bench .row{display:flex;align-items:center;gap:10px;background:#00000030;border-radius:14px;padding:7px 10px;margin:7px 0;text-align:left}
#bench .row .em{font-size:28px;width:36px;text-align:center}
#bench .row .tx{flex:1;font-size:15px}
#bench .row .tx b{font-size:17px}
#bench .row .lv{color:#ffd84a;letter-spacing:2px;font-size:13px}
#bench .row .btn{font-size:15px;padding:8px 10px;margin:0;min-width:92px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffffaa}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1220;z-index:20;font-size:22px;font-weight:800}
#loading .bar{width:220px;height:10px;background:#ffffff22;border-radius:6px;margin-top:12px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#f5c542;animation:ld 1s infinite alternate}
@keyframes ld{to{width:100%}}
#adfake{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:24px;z-index:30;pointer-events:auto}
#langSel{pointer-events:auto;background:rgba(40,24,48,.8);color:#fff;border:none;border-radius:12px;font:inherit;font-weight:800;font-size:14px;padding:6px 4px}
#pref{position:absolute;left:12px;top:54px;display:flex;gap:6px;pointer-events:auto}
@media (max-width:600px){
  #coinBox{font-size:20px;top:8px;left:8px}
  #wave{font-size:13px;top:52px;padding:4px 10px}
  #rep{font-size:16px;right:8px;top:8px}
  #rep small{display:none}
  #topBtns{top:46px;right:8px}
  #pref{top:48px;left:8px}
  #banner{font-size:28px}
  #tut{font-size:16px;bottom:20%}
  #boostBtn{font-size:14px;padding:6px 10px}
}
@media (max-height:480px){
  #tut{bottom:8%;font-size:15px}
  #banner{top:28%}
}
#taskBtn{position:relative}
#taskDot{display:none;position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:#ff4a4a;border:2px solid #fff}
#taskDot.on{display:block}
#dlDays{display:flex;gap:5px;justify-content:center;margin:6px 0;flex-wrap:wrap}
#dlDays div{width:46px;border-radius:10px;background:#00000040;padding:4px 0;font-size:11px;font-weight:800;opacity:.6}
#dlDays div b{display:block;font-size:20px}
#dlDays div.got{opacity:.45;text-decoration:line-through}
#dlDays div.now{opacity:1;background:linear-gradient(#ffcf4a,#f29a1a);color:#3a2440;transform:scale(1.08)}
#dlDays div.big b{font-size:26px}
#taskRows .row{display:flex;align-items:center;gap:10px;background:#00000030;border-radius:14px;padding:8px 10px;margin:7px 0;text-align:left}
#taskRows .tx{flex:1;font-size:15px}
#taskRows .pb{height:7px;background:#ffffff22;border-radius:4px;margin-top:4px;overflow:hidden}
#taskRows .pb i{display:block;height:100%;background:#7ee06a}
#taskRows .btn{font-size:15px;padding:8px 10px;margin:0;min-width:92px}
/* Poki pill sits at top centre on mobile: keep the goal bar clear of it */
@media (pointer:coarse),(max-width:900px),(max-height:500px){ body.pf-poki #wave{top:62px} }
@media (max-width:600px){ body.pf-poki #wave{top:92px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="coinBox" class="out"><span class="ico"></span><span id="coins">0</span></div>
  <div id="pref"><button class="rb" id="sndBtn">🔊</button><button class="rb" id="taskBtn">📋<i id="taskDot"></i></button><select id="langSel"></select></div>
  <div id="wave" class="out"><span id="waveTx"></span><div class="bar"><i id="waveBar"></i></div></div>
  <div id="rep" class="out"><small id="repTx"></small><span id="stars">★★★☆☆</span></div>
  <button id="boostBtn" class="out"></button>
  <div id="banner" class="out"></div>
  <div id="tut"></div>
</div>
<div id="joy"><i></i></div>
<div class="modal" id="bench"><div class="card"><h2 class="out" data-t="benchTitle"></h2><div id="benchRows"></div><button class="btn gray" id="benchClose" data-t="close"></button></div></div>
<div class="modal" id="daily"><div class="card"><h2 class="out" data-t="daily"></h2><div id="dlDays"></div><div data-t="streakTip" style="font-size:14px;opacity:.85;margin:6px 0"></div><div class="big out" id="dlAmt"></div><button class="btn ad" id="dlDouble"></button><button class="btn" id="dlTake" data-t="claim"></button></div></div>
<div class="modal" id="taskM"><div class="card"><h2 class="out" data-t="tasks"></h2><div id="taskRows"></div><button class="btn gray" id="taskClose" data-t="close"></button></div></div>
<div class="modal" id="offline"><div class="card"><h2 class="out" data-t="offTitle"></h2><div data-t="offDesc" style="font-size:15px"></div><div class="big out" id="offAmt"></div><button class="btn ad" id="offDouble"></button><button class="btn" id="offTake" data-t="collect"></button></div></div>
<div id="adfake"></div>
<div id="loading"><div>Dungeon Tavern</div><div class="bar"><i></i></div></div>
<script id="gamesrc" type="text/plain">
// ===== SIM START =====
// v0.3 — Dungeon Tavern: heroes sit down and order 🍺 / 🍖, you pour / grab, serve, pick up coins, wipe tables.
// Pure logic (node can run it), events go to G.ev.
var DJ = (function(){
'use strict';
var W = 12, D = 10;
// tables [x, z]; table 0 is the tutorial table next to the keg
var TABLES = [[-3.4,-5.2],[0,-5.2],[-3.4,-2.4],[3.4,-5.2],[0,-2.4],[3.4,-2.4]];
var KEG = {x:-3.6, z:-8.7, fx:-3.6, fz:-7.5};
var GRILL = {x:0, z:-8.7, fx:0, fz:-7.5};
var POT = {x:3.6, z:-8.7};             // potion cauldron: locked teaser for now
var TRASH = {x:5.15, z:-7.3};
var PADS = {bench:[-4.5,-0.95], hire:[4.5,-0.95]};
var PRICE = {beer:4, meat:9};
var POUR = 0.45, TAKE = 0.2, COOK = 4.0, EAT = 2.6, WIPE = 0.8, PATIENCE = 22, QPAT = 30;
var GRILL_MAX = 3;
var UNL = [
  {k:'table', i:1, c:20}, {k:'grill', c:45}, {k:'table', i:2, c:70}, {k:'wiper', c:130},
  {k:'table', i:3, c:220}, {k:'table', i:4, c:340}, {k:'waiter', c:500}, {k:'table', i:5, c:750},
  {k:'wiper', c:1000}, {k:'waiter', c:1400}
];
var UPG = {
  boots:{max:5, cost:[40,120,320,800,1800]},
  tray: {max:5, cost:[30,100,280,700,1600]},
  grill:{max:4, cost:[80,240,650,1500]},
  gob:  {max:3, cost:[220,700,1600]}
};
var HERO_SPEED = 2.6, BOSS_EVERY = 20;
var KINDS = ['knight','archer','mage','rogue'];

function rnd(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dist(a,b){ var dx=a.x-b.x, dz=a.z-b.z; return Math.sqrt(dx*dx+dz*dz); }

function newGame(seed){
  var G = { t:0, rand:rnd(seed||12345), ev:[], coins:0, earned:0, rep:3, unl:0, padPaid:{},
    upg:{boots:0,tray:0,grill:0,gob:0}, tables:[], heroes:[], goblins:[], pads:[], nid:1,
    grill:{on:false, ready:0, t:0},
    player:{x:0, z:-1.2, items:[], face:Math.PI, moving:false},
    spawnT:2, heroCount:0, flow:false, boost:0, tut:0, paused:false,
    stats:{unlAt:[], served:0, angry:0} };
  TABLES.forEach(function(p,i){ G.tables.push({i:i, x:p[0], z:p[1], on:i===0, dirty:false, prog:0, coins:0, hero:null, food:null}); });
  makePads(G);
  return G;
}
function seatOf(t){ return {x:t.x, z:t.z-0.95}; }
function frontOf(t){ return {x:t.x, z:t.z+1.0}; }
function aisle(t){ return t.x>=0 ? t.x+1.7 : t.x-1.7; }

// ---------- unlocks / pads ----------
function unlPos(u){
  if (u.k==='table'){ var p=TABLES[u.i]; return {x:p[0], z:p[1]-0.3}; }
  if (u.k==='grill') return {x:GRILL.fx, z:GRILL.fz+0.3};
  return {x:PADS.hire[0], z:PADS.hire[1]};
}
function makePads(G){
  G.pads=[];
  if (G.tut>=4 && G.unl<UNL.length){ var u=UNL[G.unl], p=unlPos(u); G.pads.push({kind:u.k, u:u, x:p.x, z:p.z, cost:u.c, paid:Math.min(u.c-1, G.padPaid.next||0)}); }
  if (G.tut>=7) G.pads.push({kind:'bench', x:PADS.bench[0], z:PADS.bench[1], cost:0, paid:0});
}
function applyUnlock(G, u, silent){
  if (u.k==='table'){ G.tables[u.i].on=true; }
  else if (u.k==='grill'){ G.grill.on=true; }
  else addGoblin(G, u.k);
  if (!silent) G.ev.push({t:'buy', kind:u.k, i:u.i});
}
function buyPad(G, pd){
  G.padPaid.next=0;
  applyUnlock(G, pd.u); G.unl++; G.stats.unlAt.push(G.t);
  makePads(G);
}

// ---------- heroes ----------
function freeTable(G){
  var c=G.tables.filter(function(t){ return t.on && !t.dirty && !t.hero; });
  return c.length ? c[Math.floor(G.rand()*c.length)] : null;
}
function seatPath(h, t){
  var a=aisle(t), s=seatOf(t), pts=[];
  if (h.z>-0.2) pts.push({x:0, z:0.3});
  pts.push({x:a, z:Math.min(-0.8, h.z>-0.2?-0.8:h.z)}, {x:a, z:s.z}, {x:s.x, z:s.z});
  return pts;
}
function maxHeroes(G){ return G.tables.filter(function(t){return t.on;}).length + 2; }
function spawnGap(G){
  var n=G.tables.filter(function(t){return t.on;}).length;
  return Math.max(2.2, 7.5 - n*0.8 - (G.rep-3)*0.7);
}
function pickWant(G){ return (G.grill.on && G.rand()<0.5) ? 'meat' : 'beer'; }
function spawnHero(G, opt){
  opt=opt||{};
  G.heroCount++;
  var boss = opt.boss || (G.heroCount>4 && G.heroCount%BOSS_EVERY===0);
  var h={id:G.nid++, kind:boss?'king':(opt.kind||KINDS[Math.floor(G.rand()*4)]), boss:boss, x:(G.rand()-0.5)*1.2, z:3.6,
    path:[], pi:0, state:'walk', tbl:null, want:null, pat:QPAT, sat:70, eatT:0, face:Math.PI, orders:boss?2:1};
  G.heroes.push(h); G.ev.push({t:'hero', id:h.id, boss:boss});
  if (opt.table){ seat(G,h,opt.table); } else { var t=freeTable(G); if (t) seat(G,h,t); else queue(G,h); }
  return h;
}
function seat(G,h,t){ t.hero=h.id; h.tbl=t.i; h.path=seatPath(h,t); h.pi=0; h.state='walk'; }
function queue(G,h){ h.state='queue'; h.tbl=null; h.pat=QPAT; }
function queuePos(G,h){ var q=G.heroes.filter(function(o){return o.state==='queue';}); var i=q.indexOf(h); return {x:-0.6+(i%2)*1.2, z:1.4+Math.floor(i/2)*1.0}; }
function emo(G,h,e){ G.ev.push({t:'emo', id:h.id, e:e}); }
function walk(h, dt){
  var tg=h.path[h.pi]; if (!tg) return true;
  var dx=tg.x-h.x, dz=tg.z-h.z, d=Math.sqrt(dx*dx+dz*dz), sp=HERO_SPEED*(h.boss?0.85:1)*dt;
  if (d<=sp){ h.x=tg.x; h.z=tg.z; h.pi++; return h.pi>=h.path.length; }
  h.x+=dx/d*sp; h.z+=dz/d*sp; h.face=Math.atan2(dx,dz); return false;
}
function order(G,h){
  h.want = h.boss ? (h.orders===2?'beer':(G.grill.on?'meat':'beer')) : pickWant(G);
  h.state='wait'; h.pat=PATIENCE*(h.boss?0.8:1); h.face=0;
  G.ev.push({t:'order', id:h.id, want:h.want});
}
function leave(G,h,angry){
  var t=h.tbl!==null? G.tables[h.tbl] : null;
  var pts=[];
  if (t){ var a=aisle(t), s=seatOf(t); pts.push({x:a, z:s.z}, {x:a, z:-0.8}); }
  pts.push({x:0, z:0.3}, {x:(G.rand()-0.5)*2, z:4.2});
  h.path=pts; h.pi=0; h.state='leave'; h.want=null;
  if (t){ t.hero=null; t.food=null; if (!angry) t.dirty=true; }
  h.tbl=null;
  h.sat=Math.max(0,Math.min(100,h.sat));
  var stars=Math.max(1,Math.min(5,Math.round(h.sat/20)));
  G.rep=G.rep*0.85+stars*0.15;
  G.ev.push({t:'exit', id:h.id, stars:stars, angry:!!angry});
}
function stepHero(G,h,dt){
  var tutWait = G.tut<3;
  if (h.state==='queue'){
    var t=freeTable(G); var q=G.heroes.filter(function(o){return o.state==='queue';});
    if (t && q[0]===h){ seat(G,h,t); return; }
    var p=queuePos(G,h); var dx=p.x-h.x, dz=p.z-h.z, d=Math.sqrt(dx*dx+dz*dz);
    if (d>0.05){ var m=Math.min(d,HERO_SPEED*dt); h.x+=dx/d*m; h.z+=dz/d*m; h.face=Math.atan2(dx,dz); h.moving=true; } else { h.moving=false; h.face=0; }
    if (!tutWait){ h.pat-=dt; if (h.pat<=0){ h.sat-=40; emo(G,h,'angry'); G.ev.push({t:'angry', id:h.id}); G.stats.angry++; leave(G,h,true); } }
    return;
  }
  if (h.state==='walk'){ h.moving=true; if (walk(h,dt)){ h.moving=false; order(G,h); } return; }
  if (h.state==='leave'){ h.moving=true; if (walk(h,dt)){ G.heroes.splice(G.heroes.indexOf(h),1); G.ev.push({t:'gone', id:h.id}); } return; }
  h.moving=false;
  if (h.state==='wait'){
    if (!tutWait) h.pat-=dt;
    if (h.pat<=0){ h.sat-=35; emo(G,h,'angry'); G.ev.push({t:'angry', id:h.id}); G.stats.angry++; leave(G,h,true); }
    return;
  }
  if (h.state==='eat'){
    h.eatT-=dt;
    if (h.eatT<=0){
      var t2=G.tables[h.tbl];
      var tip = h.patAt>0.6 ? 2 : (h.patAt>0.3 ? 1 : 0);
      var amt = (PRICE[t2.food]+tip) * (h.boss?5:1);
      pay(G, amt, t2.x, t2.z, t2);
      t2.food=null; h.orders--;
      if (h.orders>0 || (!h.boss && G.tut>=4 && G.rand()<0.25)){ if(h.orders<=0) h.orders=1; order(G,h); emo(G,h,'more'); }
      else leave(G,h,false);
    }
  }
}
function serve(G,h,who){
  var t=G.tables[h.tbl];
  h.patAt=h.pat/PATIENCE; h.sat+= h.patAt>0.5?15:5;
  t.food=h.want; h.state='eat'; h.eatT=EAT; h.want=null;
  G.stats.served++;
  G.ev.push({t:'serve', id:h.id, tbl:t.i, food:t.food, who:who}); emo(G,h,'happy');
}
function pay(G, amt, x, z, tbl){
  amt=Math.max(1, Math.round(amt*(G.boostMoney>0?2:1)));
  if (tbl){ tbl.coins+=amt; G.ev.push({t:'drop', tbl:tbl.i, n:amt, x:x, z:z}); }
  else { G.coins+=amt; G.earned+=amt; G.ev.push({t:'coin', n:amt, x:x, z:z}); }
  return amt;
}
function collect(G,t){ if (t.coins<=0) return; var n=Math.round(t.coins); t.coins=0; G.coins+=n; G.earned+=n; G.ev.push({t:'coin', n:n, x:t.x, z:t.z, why:'pick'}); }

// ---------- player ----------
function trayCap(G){ return 2+G.upg.tray; }
function playerSpeed(G){ return 5.0*(1+0.1*G.upg.boots)*(G.boost>0?1.35:1); }
function workSpeed(G, who){ var b=G.boost>0?1.5:1; return who==='p' ? b : 0.6*(1+0.25*G.upg.gob)*b; }
function clampPos(G,p){
  p.x=Math.max(-W/2+0.5, Math.min(W/2-0.5, p.x));
  p.z=Math.min(-0.4, Math.max(-7.8, p.z));
  G.tables.forEach(function(t){ if(!t.on) return;
    var cx=t.x, cz=t.z-0.32, hx=0.8+0.35, hz=0.92+0.35, dx=p.x-cx, dz=p.z-cz;
    if (Math.abs(dx)<hx && Math.abs(dz)<hz){ if (hx-Math.abs(dx) < hz-Math.abs(dz)) p.x=cx+(dx<0?-hx:hx); else p.z=cz+(dz<0?-hz:hz); } });
}
function nearKeg(w){ return Math.abs(w.x-KEG.fx)<1.1 && w.z<-6.6; }
function nearGrill(w){ return Math.abs(w.x-GRILL.fx)<1.1 && w.z<-6.6; }
function serveNear(G, w, who){
  if (!w.items.length) return false;
  for (var i=0;i<G.heroes.length;i++){ var h=G.heroes[i]; if (h.state!=='wait') continue;
    var t=G.tables[h.tbl]; if (dist(w,t)>1.75) continue;
    var k=w.items.lastIndexOf(h.want); if (k<0) continue;
    w.items.splice(k,1); serve(G,h,who); return true; }
  return false;
}
function wipeNear(G, w, who, dt){
  var best=null, bd=1.75;
  G.tables.forEach(function(t){ if(!t.on||!t.dirty) return; var d=dist(w,t); if(d<bd){bd=d;best=t;} });
  if (!best) return false;
  best.prog+=dt*workSpeed(G,who)/WIPE;
  if (best.prog>=1){ best.prog=0; best.dirty=false; G.ev.push({t:'wiped', tbl:best.i, who:who}); }
  return true;
}
function fillFrom(G, w, who, dt, cap, only){
  if (w.items.length>=cap){ w.pourT=0; w.takeT=0; return false; }
  if ((!only||only==='beer') && nearKeg(w)){
    w.pourT=(w.pourT||0)+dt*workSpeed(G,who)*(who==='p'?1:0.8);
    if (w.pourT>=POUR){ w.pourT=0; w.items.push('beer'); G.ev.push({t:'pour', who:who}); }
    return true;
  }
  w.pourT=0;
  if ((!only||only==='meat') && G.grill.on && nearGrill(w) && G.grill.ready>0){
    w.takeT=(w.takeT||0)+dt;
    if (w.takeT>=TAKE){ w.takeT=0; G.grill.ready--; w.items.push('meat'); G.ev.push({t:'grab', who:who}); }
    return true;
  }
  return false;
}
function stepPlayer(G, dt, ix, iz){
  var p=G.player, m=Math.sqrt(ix*ix+iz*iz); if(m>1){ix/=m;iz/=m;m=1;}
  var sp=playerSpeed(G); p.x+=ix*sp*dt; p.z+=iz*sp*dt; clampPos(G,p);
  p.moving=m>0.15; if(p.moving) p.face=Math.atan2(ix,iz);
  p.working=false;
  if (fillFrom(G,p,'p',dt,trayCap(G))) p.working=true;
  if (p.items.length && dist(p,TRASH)<1.1){ p.items=[]; G.ev.push({t:'trash'}); }
  serveNear(G,p,'p');
  if (wipeNear(G,p,'p',dt)) p.working=true;
  G.tables.forEach(function(t){ if(t.coins>0 && dist(t,p)<2.0) collect(G,t); });
  p.onPad=null;
  G.pads.forEach(function(pd){
    if (Math.abs(p.x-pd.x)<0.95 && Math.abs(p.z-pd.z)<0.95){
      p.onPad=pd; if (pd.kind==='bench') return;
      var left=pd.cost-pd.paid; if(left<=0) return;
      var give=Math.min(left, Math.max(pd.cost/1.3,25)*dt, G.coins);
      if (give>0){ G.coins-=give; pd.paid+=give; G.padPaid.next=pd.paid; G.ev.push({t:'padpay'}); if(pd.paid>=pd.cost-1e-6) buyPad(G,pd); }
    }
  });
  G.goblins.forEach(function(g){ if(g.sleep>0&&dist(g,p)<2){ g.sleep=0; G.ev.push({t:'wake',id:g.id}); } });
}

// ---------- goblins ----------
function addGoblin(G,kind){ var g={id:G.nid++, kind:kind, x:PADS.hire[0]-0.5, z:-1.6, items:[], task:null, sleep:0, nap:50+G.rand()*50, face:Math.PI}; G.goblins.push(g); return g; }
function moveTo(g,t,sp,dt){ var dx=t.x-g.x, dz=t.z-g.z, d=Math.sqrt(dx*dx+dz*dz); if(d<0.05){ g.moving=false; return true; } var m=Math.min(d,sp*dt); g.x+=dx/d*m; g.z+=dz/d*m; g.face=Math.atan2(dx,dz); g.moving=true; return d<=sp*dt; }
// walking around tables: straight line if clear, else via the free lanes (z) and aisles (x)
var LANES=[-0.9,-3.85,-6.75], AISLES=[-5.3,-1.7,1.7,5.3];
function segHits(G,a,b){
  for (var i=0;i<G.tables.length;i++){ var t=G.tables[i]; if(!t.on) continue;
    var x0=t.x-1.05, x1=t.x+1.05, z0=t.z-1.5, z1=t.z+0.85;
    for (var k=0;k<=10;k++){ var x=a.x+(b.x-a.x)*k/10, z=a.z+(b.z-a.z)*k/10; if(x>x0&&x<x1&&z>z0&&z<z1) return true; } }
  return false;
}
function near(arr,v){ var b=arr[0]; arr.forEach(function(l){ if(Math.abs(l-v)<Math.abs(b-v)) b=l; }); return b; }
function nextStep(G,g,tgt){
  if (!segHits(G,g,tgt)) return tgt;
  var tl=near(LANES,tgt.z), ax0=near(AISLES,g.x);
  if (Math.abs(g.x-ax0)<0.15){ if (Math.abs(g.z-tl)>0.15) return {x:ax0, z:tl}; return {x:tgt.x, z:tl}; }
  var lz=near(LANES,g.z);
  if (Math.abs(g.z-lz)>0.15) return {x:g.x, z:lz};
  if (tl===lz) return {x:tgt.x, z:lz};
  return {x:near(AISLES,(g.x+tgt.x)/2), z:lz};
}
function routeTo(g, tgt, sp, dt, G){ var s=nextStep(G,g,tgt); var done=moveTo(g,s,sp,dt); return done && s===tgt; }
function stepGoblin(G,g,dt){
  g.moving=false; g.working=false;
  if (g.sleep>0){ g.sleep-=dt; if(g.sleep<=0) G.ev.push({t:'wake',id:g.id}); return; }
  g.nap-=dt; if (g.nap<=0){ g.nap=70+G.rand()*60; if(G.rand()<0.4){ g.sleep=12; G.ev.push({t:'sleep',id:g.id}); return; } }
  var sp=2.8*(1+0.15*G.upg.gob)*(G.boost>0?1.5:1);
  var others=G.goblins.filter(function(o){return o!==g&&o.task;});
  if (g.kind==='wiper'){
    var t=g.task;
    if (t && (!t.dirty)) t=g.task=null;
    if (!t){ var bd=1e9; G.tables.forEach(function(tb){ if(!tb.on||!tb.dirty) return; if(others.some(function(o){return o.task===tb;})) return; var d=dist(tb,g); if(d<bd){bd=d;t=tb;} }); g.task=t; }
    if (!t){ routeTo(g,{x:-5.0+((g.id*0.9)%1.5), z:-3.85}, sp*0.5, dt, G); return; }
    var f=frontOf(t);
    if (dist(g,f)>0.25){ routeTo(g,f,sp,dt,G); return; }
    g.face=Math.PI; g.working=wipeNear(G,g,'g',dt); return;
  }
  // waiter: fetch for the most impatient hero nobody else is serving
  if (g.items.length){
    var want=g.items[0], hh=null, bp=1e9;
    G.heroes.forEach(function(h){ if(h.state==='wait'&&h.want===want&&h.pat<bp&&!others.some(function(o){return o.task===h;})){ bp=h.pat; hh=h; } });
    if (!hh){ if (G.rand()<dt*0.1) g.items=[]; routeTo(g,{x:2.0,z:-6.75},sp*0.5,dt,G); return; }
    g.task=hh; var ft=frontOf(G.tables[hh.tbl]);
    if (dist(g,ft)>0.3){ routeTo(g,ft,sp,dt,G); return; }
    serveNear(G,g,'g'); return;
  }
  var tgt=null, bp2=1e9;
  G.heroes.forEach(function(h){ if(h.state==='wait'&&h.pat<bp2&&!others.some(function(o){return o.task===h;})){ if(h.want==='meat'&&G.grill.ready<=0&&G.heroes.some(function(x){return x.state==='wait'&&x.want==='beer';})) return; bp2=h.pat; tgt=h; } });
  g.task=tgt;
  if (!tgt){ routeTo(g,{x:2.0,z:-6.75},sp*0.5,dt,G); return; }
  var src = tgt.want==='beer' ? {x:KEG.fx+0.5, z:-7.2} : {x:GRILL.fx+0.5, z:-7.2};
  if (dist(g,src)>0.25){ routeTo(g,src,sp,dt,G); return; }
  g.working=fillFrom(G,g,'g',dt,1,tgt.want);
}

// ---------- main ----------
function step(G, dt, ix, iz){
  if (G.paused) return;
  G.t+=dt;
  if (G.boost>0) G.boost=Math.max(0,G.boost-dt);
  if (G.boostMoney>0) G.boostMoney=Math.max(0,G.boostMoney-dt);
  if (G.grill.on && G.grill.ready<GRILL_MAX){ G.grill.t+=dt*(1+0.35*G.upg.grill)*(G.boost>0?1.5:1); if (G.grill.t>=COOK){ G.grill.t=0; G.grill.ready++; G.ev.push({t:'cooked'}); } }
  stepPlayer(G,dt,ix||0,iz||0);
  G.goblins.forEach(function(g){ stepGoblin(G,g,dt); });
  G.heroes.slice().forEach(function(h){ stepHero(G,h,dt); });
  if (G.flow){ G.spawnT-=dt; if (G.spawnT<=0 && G.heroes.filter(function(h){return h.state!=='leave';}).length<maxHeroes(G)){ G.spawnT=spawnGap(G)*(0.8+G.rand()*0.4); spawnHero(G); } }
}
// ---------- save ----------
function save(G){
  return JSON.stringify({v:3, coins:Math.floor(G.coins), earned:Math.floor(G.earned), rep:G.rep, unl:G.unl, upg:G.upg, tut:G.tut, heroCount:G.heroCount,
    tb:G.tables.map(function(t){ return [t.dirty?1:0, Math.round(t.coins)]; }), next:Math.floor(G.padPaid.next||0), ipm:G.ipm||0, ready:G.grill.ready});
}
function load(str){
  var o=JSON.parse(str); if(!o||o.v!==3) return null;
  var G=newGame(Date.now()%100000);
  G.coins=o.coins; G.earned=o.earned||0; G.rep=o.rep||3; G.upg=o.upg; G.tut=o.tut; G.heroCount=o.heroCount||0; G.ipm=o.ipm||0; G.padPaid={next:o.next||0};
  for (var i=0;i<o.unl&&i<UNL.length;i++) applyUnlock(G, UNL[i], true);
  G.unl=Math.min(o.unl, UNL.length); G.grill.ready=o.ready||0;
  (o.tb||[]).forEach(function(a,i){ var t=G.tables[i]; if(t&&t.on){ t.dirty=!!a[0]; t.coins=a[1]||0; } });
  G.ev=[]; makePads(G);
  return G;
}
function buyUpgrade(G,k){ var u=UPG[k]; if(G.upg[k]>=u.max) return false; var c=u.cost[G.upg[k]]; if(G.coins<c) return false; G.coins-=c; G.upg[k]++; G.ev.push({t:'buy',kind:'upg',k:k}); return true; }
return {W:W, D:D, TABLES:TABLES, KEG:KEG, GRILL:GRILL, POT:POT, TRASH:TRASH, PADS:PADS, UNL:UNL, UPG:UPG, PATIENCE:PATIENCE, QPAT:QPAT, GRILL_MAX:GRILL_MAX, PRICE:PRICE,
  newGame:newGame, step:step, makePads:makePads, spawnHero:spawnHero, trayCap:trayCap, playerSpeed:playerSpeed, save:save, load:load,
  buyUpgrade:buyUpgrade, nextStep:nextStep, pay:pay, collect:collect, seatOf:seatOf, frontOf:frontOf, nearKeg:nearKeg, nearGrill:nearGrill};
})();

function addWall(grp, x0,z0,x1,z1, h, m){
  var w=Math.abs(x1-x0)||0.6, d=Math.abs(z1-z0)||0.6, cx=(x0+x1)/2, cz=(z0+z1)/2;
  grp.add(mesh(gBox(w,h,d), m||M.wall, cx, h/2, cz));
  grp.add(mesh(gBox(w+0.06,0.14,d+0.06), M.wallTop, cx, h+0.07, cz, false));
}
function mulberry(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

var kegV=null, grillV=null, trashV=null;
function buildTavern(){
  var g=new T.Group(), hw=W/2;
  // outside ground + path
  var gr=mesh(new T.PlaneGeometry(60, 30), mat(0x2b2032), 0, -0.02, 14, false); gr.rotation.x=-Math.PI/2; g.add(gr);
  var path=mesh(new T.PlaneGeometry(2.6, 8), mat(0x6a5a64), 0, -0.01, 4, false); path.rotation.x=-Math.PI/2; g.add(path);
  // floor
  var f=mesh(new T.PlaneGeometry(W, D), M.floor, 0, 0, -D/2, false); f.rotation.x=-Math.PI/2; g.add(f);
  // rug at the entrance
  var rug=mesh(new T.PlaneGeometry(2.2, 1.4), mat(0xb03a3a,{flat:false}), 0, 0.012, -0.8, false); rug.rotation.x=-Math.PI/2; g.add(rug);
  // walls
  addWall(g, -hw-0.3, 0.15, -hw-0.3, -D, 2.4); addWall(g, hw+0.3, 0.15, hw+0.3, -D, 2.4);
  addWall(g, -hw-0.3, -D-0.2, hw+0.3, -D-0.2, 3.2);
  addWall(g, -hw-0.3, 0.15, -1.4, 0.15, 0.45); addWall(g, 1.4, 0.15, hw+0.3, 0.15, 0.45);
  [-1.5,1.5].forEach(function(x){ g.add(mesh(gBox(0.45,0.8,0.45), M.woodDark, x, 0.4, 0.15)); g.add(mesh(new T.ConeGeometry(0.12,0.3,6), M.flame, x, 0.95, 0.15, false)); });
  // shelves with bottles on the back wall
  var rr=mulberry(7);
  [1.3,2.1].forEach(function(y){ g.add(mesh(gBox(W-1,0.08,0.4), M.woodDark, 0, y, -D+0.1, false));
    for (var i=0;i<14;i++){ var bx=-hw+0.9+i*0.75+rr()*0.2; if (Math.abs(bx-DJ.GRILL.x)<1.3) continue; var c=[0x5ad27a,0xd25a5a,0x5a8ad2,0xe0c050][Math.floor(rr()*4)];
      g.add(mesh(new T.CylinderGeometry(0.08,0.1,0.32,6), mat(c), bx, y+0.2, -D+0.12, false)); } });
  // bar counter (gap behind it is staff-only)
  g.add(mesh(gBox(W-0.6,0.95,0.7), M.wood, 0, 0.475, -8.35));
  g.add(mesh(gBox(W-0.4,0.1,0.85), M.woodLight, 0, 1.0, -8.35));
  // lanterns on the side walls
  [-5.2,-1.6].forEach(function(z){ [-hw, hw].forEach(function(x,i){
    var lx=x+(i?-0.18:0.18); g.add(mesh(gBox(0.22,0.3,0.22), M.darkMetal, lx, 1.9, z));
    var fl=mesh(new T.ConeGeometry(0.1,0.24,6), M.flame, lx, 1.92, z, false); g.add(fl);
    torches.push({x:x+(i?-0.6:0.6), z:z, fl:fl, ph:Math.random()*6}); }); });
  // barrels in corners
  [[-5.4,-7.0],[-5.4,-6.3],[5.4,-3.8]].forEach(function(p){ var br=mesh(new T.CylinderGeometry(0.35,0.3,0.7,8), M.chest, p[0], 0.35, p[1]); g.add(br); });
  world.add(g);
  buildKeg(); buildGrill(); buildPot(); buildTrash();
}

function makeLabel(text, w, h, color, bg, font){
  if (COVER) text=''; // store covers: no in-world text
  var tex=canvasTex(w,h,function(x){ drawLabel(x,w,h,text,color,bg,font); });
  var m=new T.Mesh(new T.PlaneGeometry(1,1), new T.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  m.userData.redraw=function(t){ var cv=tex.image, x=cv.getContext('2d'); x.clearRect(0,0,w,h); drawLabel(x,w,h,t,color,bg,font); tex.needsUpdate=true; };
  return m;
}
function drawLabel(x,w,h,text,color,bg,font){
  if (bg){ x.fillStyle=bg; x.beginPath(); if(x.roundRect) x.roundRect(2,2,w-4,h-4,h/2.5); else x.rect(2,2,w-4,h-4); x.fill(); }
  x.font=(font||'900 '+Math.floor(h*0.55)+'px "Trebuchet MS",system-ui,sans-serif'); x.textAlign='center'; x.textBaseline='middle';
  x.lineWidth=Math.max(3,h*0.08); x.strokeStyle='#2a1a2e'; if(!bg) x.strokeText(text,w/2,h/2+2);
  x.fillStyle=color; x.fillText(text,w/2,h/2+2);
}
function spriteIcon(emoji, ring){
  var tex=canvasTex(128,128,function(x){ x.fillStyle=ring||'#fff'; x.beginPath(); x.arc(64,58,48,0,7); x.fill(); x.beginPath(); x.moveTo(50,100); x.lineTo(78,100); x.lineTo(64,122); x.fill();
    x.fillStyle='#3a2440'; x.font='60px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(emoji,64,62); });
  var s=new T.Sprite(new T.SpriteMaterial({map:tex, depthTest:false, transparent:true})); s.scale.set(0.9,0.9,1); s.renderOrder=10; return s;
}
var iconCache={};
function iconMat(emoji, ring){ var k=emoji+(ring||''); if(!iconCache[k]) iconCache[k]=spriteIcon(emoji,ring).material; return iconCache[k]; }
function iconSprite(emoji, ring){ var s=new T.Sprite(iconMat(emoji,ring)); s.scale.set(0.9,0.9,1); s.renderOrder=10; return s; }

var capGeo=new T.CapsuleGeometry(0.3,0.36,3,8), headGeo=new T.SphereGeometry(0.3,10,8), eyeGeo=new T.SphereGeometry(0.055,6,5), legGeo=gBox(0.16,0.4,0.18);
function makeChar(o){
  var g=new T.Group(), inner=new T.Group(); g.add(inner);
  var body=mesh(capGeo, mat(o.body), 0, 0.78, 0); inner.add(body);
  var head=mesh(headGeo, mat(o.skin||0xffd2a8), 0, 1.38, 0); inner.add(head);
  [-0.11,0.11].forEach(function(x){ inner.add(mesh(eyeGeo, M.black, x, 1.42, 0.26, false)); });
  var legs=[-0.13,0.13].map(function(x){ var l=mesh(legGeo, mat(o.leg||0x3a2a3a), x, 0.32, 0); l.geometry=legGeo; inner.add(l); return l; });
  var hm=mat(o.hatc||0xffd84a);
  if (o.hat==='cap'){ inner.add(mesh(new T.SphereGeometry(0.31,10,6,0,Math.PI*2,0,Math.PI/2), hm, 0,1.45,0)); inner.add(mesh(gBox(0.4,0.05,0.25), hm, 0,1.47,0.25)); }
  if (o.hat==='helm'){ inner.add(mesh(new T.SphereGeometry(0.33,10,6,0,Math.PI*2,0,Math.PI/1.8), hm, 0,1.4,0)); inner.add(mesh(gBox(0.05,0.3,0.05), mat(0xd94848), 0,1.78,0)); }
  if (o.hat==='hood'){ inner.add(mesh(new T.ConeGeometry(0.36,0.55,8), hm, 0,1.66,-0.03)); }
  if (o.hat==='wizard'){ var wz=mesh(new T.ConeGeometry(0.34,0.8,8), hm, 0,1.85,0); wz.rotation.x=-0.2; inner.add(wz); inner.add(mesh(new T.CylinderGeometry(0.46,0.46,0.05,10), hm, 0,1.55,0)); }
  if (o.hat==='crown'){ for (var i=0;i<5;i++){ var a=i/5*Math.PI*2; inner.add(mesh(new T.ConeGeometry(0.07,0.22,4), M.gold, Math.cos(a)*0.22,1.72,Math.sin(a)*0.22)); } inner.add(mesh(new T.CylinderGeometry(0.26,0.26,0.1,10), M.gold,0,1.62,0)); }
  if (o.hat==='tophat'){ inner.add(mesh(new T.CylinderGeometry(0.2,0.2,0.4,10), hm, 0,1.82,0)); inner.add(mesh(new T.CylinderGeometry(0.34,0.34,0.04,10), hm, 0,1.63,0)); }
  if (o.ears){ [-1,1].forEach(function(s){ var e=mesh(new T.ConeGeometry(0.1,0.35,4), mat(o.skin), s*0.33,1.42,0); e.rotation.z=-s*1.2; inner.add(e); }); }
  if (o.apron){ inner.add(mesh(gBox(0.42,0.4,0.05), mat(o.apron), 0,0.72,0.3)); }
  if (o.cape){ var cp=mesh(gBox(0.6,0.9,0.05), mat(o.cape), 0,0.85,-0.3); inner.add(cp); }
  if (o.mop){ var mp=new T.Group(); mp.add(mesh(new T.CylinderGeometry(0.035,0.035,1.3,5), M.rope, 0,0.65,0)); mp.add(mesh(new T.CylinderGeometry(0.16,0.2,0.18,7), mat(0x7ad0e8), 0,0.05,0)); mp.position.set(0.42,0.1,0.12); mp.rotation.z=-0.25; inner.add(mp); g.userData.mop=mp; }
  if (o.sword){ var sw=mesh(gBox(0.07,0.7,0.12), M.metal, 0.4,0.85,0.15); inner.add(sw); }
  if (o.staff){ inner.add(mesh(new T.CylinderGeometry(0.04,0.04,1.4,5), M.rope, 0.4,0.75,0.1)); inner.add(mesh(new T.OctahedronGeometry(0.13), mat(0x7ae8ff,{emissive:0x2266aa}), 0.4,1.5,0.1)); }
  if (o.bow){ var bw=mesh(new T.TorusGeometry(0.35,0.03,4,10,Math.PI), M.rope, 0.38,0.85,0); bw.rotation.y=Math.PI/2; bw.rotation.z=Math.PI/2; inner.add(bw); }
  if (o.bag){ var bg=mesh(sackGeo, M.sack, -0.05,0.95,-0.38); bg.scale.setScalar(0.9); inner.add(bg); }
  g.scale.setScalar(o.scale||1);
  g.userData.legs=legs; g.userData.inner=inner; g.userData.ph=Math.random()*6;
  world.add(g); return g;
}
function animChar(g, moving, dt, working){
  var u=g.userData; u.ph+=dt*(moving?13:4);
  var a=moving?Math.sin(u.ph)*0.7:0;

function stepTut(dt){

  else if (t===1){ if (G.stats.served>0) G.tut=2; }
  else if (t===2){ if (!tutHero() && t0.coins<=0 && !t0.dirty){ G.tut=3; tutT=0; G.flow=true; G.spawnT=1.5; } }
  else if (t===3){ tutT+=dt; if (tutT>8){ G.tut=4; DJ.makePads(G); syncPads(); } }
  else if (t===4){ if (G.unl>=1) G.tut=5; }
  else if (t===5){ if (G.grill.on) G.tut=6; }
  else if (t===6){ if (G.player.items.indexOf('meat')>=0){ G.tut=7; tutT=0; DJ.makePads(G); syncPads(); } }
  else if (t===7){ tutT+=dt; if (benchOpen || tutT>12) G.tut=99; }

        break;
      case 'padpay': if(Math.random()<0.3) Snd.pay(); break;
      case 'pour': if(e.who==='p'){ Daily.count('pour'); Snd.pour(); } break;
      case 'grab': if(e.who==='p') Snd.take(); break;

// ---------------- daily reward + daily tasks ----------------
// Rewards scale with the next room's price so they stay meaningful at every stage.
var Daily = (function(){
  var D=null, DAYS=[0.10,0.12,0.15,0.18,0.22,0.27,0.6], DEF={serve:[20,10],wipe:[12,6],pour:[20,10]};
  function today(o){ var d=new Date(Date.now()+(o||0)*864e5); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function nextCost(){ var u=DJ.UNL[Math.min(G.unl, DJ.UNL.length-1)]; return Math.max(60, u.c); }
  function amt(f){ return Math.max(20, Math.round(nextCost()*f/5)*5); }

    D.tasks=['serve','wipe','pour'].map(function(k){ return {k:k, n:DEF[k][0]+DEF[k][1]*r, c:0, claimed:false, f:0.25}; });
    save();
  }
  function count(k){ if(!D||G.tut<99) return; D.tasks.forEach(function(t){ if(t.k!==k||t.c>=t.n) return; t.c++; if(t.c===t.n){ banner(tl('taskDone'), tl('task_'+t.k,{n:t.n}), 2000); Snd.buy(); save(); } }); dot(); }
  function dot(){ var on = D && D.tasks.some(function(t){ return t.c>=t.n && !t.claimed; }); $('taskDot').classList.toggle('on', !!on); }
  function renderTasks(){
    var rows=$('taskRows'); rows.innerHTML='';
    D.tasks.forEach(function(t){
      var r=document.createElement('div'); r.className='row';
      r.innerHTML='<div class="tx"><b></b><div class="pb"><i style="width:'+Math.min(100,t.c/t.n*100)+'%"></i></div></div>';
      r.querySelector('b').textContent=tl('task_'+t.k,{n:t.n})+'  '+Math.min(t.c,t.n)+'/'+t.n;

      else { b.textContent='● '+fmt(amt(t.f)); b.disabled=t.c<t.n; b.onclick=function(){ t.claimed=true; DJ.pay(G, amt(t.f), G.player.x, G.player.z, 'task'); Snd.buy(); save(); renderTasks(); dot(); }; }

  }
  $('taskBtn').onclick=function(){ if(!D||G.tut<99||PF.adBusy) return; rollTasks(); renderTasks(); $('taskM').classList.add('show'); };
  $('taskClose').onclick=function(){ $('taskM').classList.remove('show'); };
  function showReward(){
    if (D.last===today()) return false;
    var streak = D.last===today(-1) ? (D.streak%7)+1 : 1, a=amt(DAYS[streak-1]);
    var row=$('dlDays'); row.innerHTML='';
    for (var i=1;i<=7;i++){ var c=document.createElement('div'); c.className=(i<streak?'got':(i===streak?'now':''))+(i===7?' big':''); c.innerHTML='<b>'+(i===7?'💰':'🪙')+'</b>'; c.appendChild(document.createTextNode(tl('dayN',{n:i}))); row.appendChild(c); }
    $('dlAmt').textContent='● '+fmt(a);
    var dbl=$('dlDouble'); dbl.textContent=tl('double'); dbl.disabled=false;
    var close=function(n){ D.last=today(); D.streak=streak; save(); $('daily').classList.remove('show'); DJ.pay(G, n, G.player.x, G.player.z, 'daily'); Snd.buy(); saveNow(); };
    $('dlTake').onclick=function(){ close(a); };
    dbl.onclick=function(){ dbl.disabled=true; PF.rewarded(function(ok){ if(ok) close(a*2); else dbl.disabled=false; }); };
    $('daily').classList.add('show'); return true;
  }
  return {
    start:function(){ load(); $('taskBtn').style.display = G.tut>=99 ? '' : 'none'; if (G.tut<99) return; rollTasks(); dot(); },
    tick:function(){ if(!D) return; if (G.tut>=99 && $('taskBtn').style.display==='none'){ $('taskBtn').style.display=''; rollTasks(); dot(); }
      if (G.tut>=99 && D.tday!==today()){ rollTasks(); dot(); } },

    count:count, refresh:function(){ if($('taskM').classList.contains('show')) renderTasks(); }
  };
})();
